name: Gerar APK do STX Control
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gravar impressão digital do app web (anti-adulteração)
        run: |
          H=$(sha256sum app/src/main/assets/www/index.html | cut -d' ' -f1)
          sed -i "s/WEB_SHA256 = \"[0-9a-f]*\"/WEB_SHA256 = \"$H\"/" app/src/main/java/br/com/guucds/stxcontrol/Integrity.java
          grep WEB_SHA256 app/src/main/java/br/com/guucds/stxcontrol/Integrity.java
      - name: Compilar
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          STX_KS_PASS: ${{ secrets.STX_KS_PASS }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk STX-Control.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STX-Control-apk
          path: STX-Control.apk
      - name: Publicar versão (link fixo para baixar no tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: STX Control 1.0.${{ github.run_number }}
          files: STX-Control.apk
          make_latest: true
