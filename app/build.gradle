plugins { id 'com.android.application' }
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
android {
    namespace 'br.com.guucds.stxcontrol'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.guucds.stxcontrol'
        minSdk 23
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        release { storeFile file('../stx-release.jks'); storePassword 'stxcontrol2026'; keyAlias 'stx'; keyPassword 'stxcontrol2026' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
