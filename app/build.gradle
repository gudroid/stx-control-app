plugins { id 'com.android.application' }
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
android {
    namespace 'br.com.guucds.stxcontrol'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.guucds.stxcontrol'
        minSdk 23
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        // senha vem do Secret do GitHub (STX_KS_PASS); o valor antigo só serve de reserva para compilar local
        def pw = System.getenv('STX_KS_PASS') ?: 'stxcontrol2026'
        release { storeFile file('../stx-release.jks'); storePassword pw; keyAlias 'stx'; keyPassword pw }
    }
    buildTypes {
        release {
            minifyEnabled true          // R8: ofusca/encurta nomes de classes e métodos e remove código não usado
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
