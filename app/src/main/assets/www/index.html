<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="mobile-web-app-capable" content="yes">
<title>STX Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Painel noturno de som automotivo: grafite profundo, brilho âmbar de display LCD, brasa como destaque raro.
   Layout: barra superior com relógio central, trilho de navegação à esquerda, conteúdo, mini player fixo. */
:root{
  --bg:#07090d;
  --panel:#10141c;
  --line:#1f2733;
  --ink:#eef1f6;
  --muted:#8a94a6;
  --amber:#ffb23f;
  --acc-rgb:255,178,63;--emb-rgb:255,90,54;--acc-hi:#ffd287;--acc-lo:#d98a1c;
  --ember:#ff5a36;
  --ok:#3ddc97;
  --bad:#ff4d5e;
  --panel-2:#151b26;
  --glass:rgba(16,20,28,.72);
  --amber-soft:rgba(255,178,63,.14);
  --font-display:"Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --font-body:"Manrope", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r:16px;
  --r-sm:10px;
  --rail:88px;
  --top:68px;
  --mini:84px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:15px/1.5 var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{ /* textura sutil de grade, como malha de alto-falante */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 78% -10%, rgba(var(--acc-rgb),.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(var(--emb-rgb),.07), transparent 60%),
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 1.2px) 0 0/18px 18px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ---------- Estrutura ---------- */
.app{position:relative;z-index:1;display:grid;height:100%;
  grid-template-columns:var(--rail) 1fr;grid-template-rows:var(--top) auto 1fr;
  grid-template-areas:"top top" "rail banner" "rail main";}
.topbar{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  padding:0 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(16,20,28,.9),rgba(7,9,13,.6));
  backdrop-filter:blur(14px);}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:conic-gradient(from 200deg,var(--amber),var(--ember),#7a2a12,var(--amber));
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(255,120,40,.35);}
.brand-mark svg{width:22px;height:22px}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-txt b{font-family:var(--font-display);font-size:17px;letter-spacing:.16em}
.brand-txt span{font-size:12px;color:var(--muted)}
.clock{text-align:center;line-height:1}
.clock .t{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.06em;
  color:var(--amber);text-shadow:0 0 18px rgba(var(--acc-rgb),.45)}
.clock .d{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.top-right{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.ok i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.pill.warn i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.pill.bad i{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.pill.btn:hover{border-color:var(--amber)}

.rail{grid-area:rail;display:flex;flex-direction:column;gap:6px;padding:14px 10px;border-right:1px solid var(--line);
  background:rgba(10,13,19,.6)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;
  color:var(--muted);font-size:11px;font-weight:600;transition:.2s}
.rail button svg{width:24px;height:24px}
.rail button:hover{color:var(--ink);background:var(--panel)}
.rail button.on{color:var(--amber);background:var(--amber-soft);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.25)}
.rail .sp{flex:1}

.banner-zone{grid-area:banner;display:flex;flex-direction:column;gap:8px;padding:0 22px}
.banner-zone:not(:empty){padding-top:12px}
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:13.5px;
  background:var(--amber-soft);border:1px solid rgba(var(--acc-rgb),.3)}
.banner.bad{background:rgba(255,77,94,.12);border-color:rgba(255,77,94,.35)}
.banner b{font-family:var(--font-display)}
.banner .grow{flex:1}
.banner .btn{height:32px;font-size:13px}

.main{grid-area:main;overflow:auto;padding:18px 22px 28px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:#1c2430;border-radius:10px;border:3px solid var(--bg)}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;
  font-weight:700;background:var(--panel-2);border:1px solid var(--line);transition:.18s;white-space:nowrap}
.btn:hover{border-color:#334055;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,#ffc463,var(--amber));color:#1a1206;border:0;
  box-shadow:0 10px 28px rgba(var(--acc-rgb),.28),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.hot{background:linear-gradient(180deg,#ff7a55,var(--ember));color:#fff;border:0;box-shadow:0 10px 28px rgba(var(--emb-rgb),.3)}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);transition:.15s}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{color:var(--amber)}

.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:30px;line-height:1.1}
.view-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs button{color:var(--muted);font-weight:600;padding:3px 8px;border-radius:8px}
.crumbs button:hover{color:var(--amber);background:var(--panel)}
.crumbs .cur{color:var(--ink);font-weight:700;padding:3px 0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;padding:6px 10px 6px 6px;
  border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-right:6px}
.back svg{width:18px;height:18px}

.search{position:relative;flex:1;max-width:420px;min-width:220px}
.search input{width:100%;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  padding:0 14px 0 42px;outline:none}
.search input:focus{border-color:var(--amber)}
.search svg{position:absolute;left:13px;top:12px;width:20px;height:20px;color:var(--muted)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.seg button{height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.25)}

.scanbar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:18px}
.scanbar .meter{flex:1;height:8px;border-radius:8px;background:#0b0f15;overflow:hidden;position:relative}
.scanbar .meter i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--ember),var(--amber));
  box-shadow:0 0 14px rgba(var(--acc-rgb),.5);transition:width .3s}
.scanbar .blocks{display:flex;gap:3px}
.scanbar .blocks span{width:6px;height:14px;border-radius:2px;background:#1b2330}
.scanbar .blocks span.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.scanbar small{color:var(--muted);font-size:12.5px;white-space:nowrap}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.card{position:relative;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;
  text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:#3a4658;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card .art{aspect-ratio:1;position:relative;display:grid;place-items:center;overflow:hidden}
.card .art b{font-family:var(--font-display);font-size:44px;color:rgba(255,255,255,.92);text-shadow:0 4px 18px rgba(0,0,0,.4);letter-spacing:.04em}
.card .art em{position:absolute;left:10px;top:10px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.12em;
  padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.card .meta{padding:11px 13px 13px}
.card .meta h3{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.card .meta p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.card.loading .art{background:linear-gradient(110deg,#121822 30%,#1a2230 50%,#121822 70%) 0 0/300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-300% 0}}
.art{background:#1a2230}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.45))}
.art.genre::before{content:"";position:absolute;inset:-30%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 2px,transparent 3px 9px);opacity:.7}

.list{display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:9px 12px 9px 14px;
  border-bottom:1px solid rgba(31,39,51,.7);min-height:56px;text-align:left;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:#141a24}
.row .n{font-family:var(--font-display);color:var(--muted);font-size:13px;text-align:right}
.row .t{min-width:0}
.row .t b{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.row .t small{color:var(--muted);font-size:12px}
.row .acts{display:flex;gap:2px;opacity:.75}
.row:hover .acts{opacity:1}
.row .acts .icon-btn{width:36px;height:36px}
.row .acts svg{width:19px;height:19px}
.row.playing{background:linear-gradient(90deg,var(--amber-soft),transparent 70%)}
.row.playing .t b{color:var(--amber)}
.row.skel b{height:12px;width:55%;border-radius:6px;background:#1a2230}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--amber);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

.empty{display:grid;place-items:center;text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);margin-bottom:6px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-title h2{font-size:19px}
.section-title small{color:var(--muted)}

/* ---------- Mini player ---------- */
.mini{grid-area:mini;display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr);gap:18px;align-items:center;
  padding:0 18px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(16,20,28,.96),rgba(12,15,21,.9));
  backdrop-filter:blur(16px);position:relative}
.mini .prog{position:absolute;left:0;right:0;top:-1px;height:3px;background:transparent}
.mini .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--amber));box-shadow:0 0 10px var(--amber)}
.mini .now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.mini .cover{width:56px;height:56px;border-radius:12px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center}
.mini .cover b{font-family:var(--font-display);font-size:20px;position:relative;z-index:1}
.mini .now .tx{min-width:0}
.mini .now .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .now .tx small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ctl{display:flex;align-items:center;gap:6px}
.play-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--acc-hi),var(--amber) 55%,var(--acc-lo));color:#1a1206;
  box-shadow:0 8px 24px rgba(var(--acc-rgb),.4),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s}
.play-btn:hover{transform:scale(1.06)}
.play-btn svg{width:24px;height:24px}
.mini .side{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
.vol svg{width:20px;height:20px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:#1b2330;outline:none;width:120px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);border:0}

/* ---------- Player em tela cheia ---------- */
.fs{position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto 1fr;background:#05070a;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .35s,transform .35s}
.fs.open{opacity:1;pointer-events:auto;transform:none}
.fs .bgart{position:absolute;inset:-20%;filter:blur(80px) saturate(1.4);opacity:.45;transition:background 1s}
.fs .veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,transparent,rgba(5,7,10,.85) 70%)}
.fs-top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 22px}
.fs-clock{text-align:center;line-height:1}
.fs-clock .t{font-family:var(--font-display);font-weight:700;font-size:64px;letter-spacing:.06em;color:var(--amber);
  text-shadow:0 0 30px rgba(var(--acc-rgb),.5)}
.fs-clock .d{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.fs-body{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;padding:0 28px 28px;min-height:0}
.fs-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:0;text-align:center}
.fs-cover{width:min(42vh,380px);aspect-ratio:1;border-radius:26px;position:relative;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08) inset}
.fs-cover b{font-family:var(--font-display);font-size:96px;position:relative;z-index:1;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.fs-cover .disc{position:absolute;inset:14%;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,.25) 0 1px,transparent 2px 5px);
  animation:spin 8s linear infinite;animation-play-state:paused;opacity:.55}
.fs.playing .fs-cover .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.fs-title h2{font-size:clamp(24px,3.4vw,40px);line-height:1.15;max-width:22ch;margin:0 auto}
.fs-title p{margin:8px 0 0;color:var(--muted);font-weight:600}
.fs-title p span{color:var(--amber)}
.seekrow{width:min(640px,100%);display:grid;grid-template-columns:52px 1fr 52px;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.seek{height:8px;border-radius:8px;background:#1b2330;position:relative;cursor:pointer}
.seek i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--ember),var(--amber));box-shadow:0 0 14px rgba(var(--acc-rgb),.6)}
.seek i::after{content:"";position:absolute;right:-7px;top:-4px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--amber)}
.fs-ctl{display:flex;align-items:center;gap:14px}
.fs-ctl .icon-btn{width:54px;height:54px;border-radius:16px}
.fs-ctl .icon-btn svg{width:28px;height:28px}
.fs-ctl .play-btn{width:84px;height:84px}
.fs-ctl .play-btn svg{width:36px;height:36px}
.fs-sub{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.fs-side{display:flex;flex-direction:column;min-height:0;border-radius:22px;background:rgba(16,20,28,.6);border:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(20px);overflow:hidden}
.fs-side .tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.fs-side .tabs button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.fs-side .tabs button.on{background:var(--amber-soft);color:var(--amber)}
.fs-side .q{overflow:auto;padding:6px}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;text-align:left;width:100%}
.qrow:hover{background:rgba(255,255,255,.04)}
.qrow .mc{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;position:relative;overflow:hidden;font-family:var(--font-display);font-weight:700}
.qrow b{display:block;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.qrow small{color:var(--muted);font-size:12px}
.qrow.now{background:var(--amber-soft)}
.qrow.now b{color:var(--amber)}
.fs-close{justify-self:start}

/* ---------- Telas de bloqueio, modais ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(3,4,7,.72);backdrop-filter:blur(10px)}
.modal{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:22px;background:var(--panel);border:1px solid var(--line);
  padding:24px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.field input,.field textarea,.field select{background:#0b0f15;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;width:100%}
.field textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.field input:focus,.field textarea:focus{border-color:var(--amber)}

.lock{position:fixed;inset:0;z-index:80;overflow:auto;background:
  radial-gradient(900px 500px at 50% -10%,rgba(var(--emb-rgb),.18),transparent 60%),rgba(5,7,10,.94);backdrop-filter:blur(18px)}
.lock-in{max-width:1080px;margin:0 auto;padding:36px 20px 40px;display:flex;flex-direction:column;gap:26px;align-items:center;text-align:center}
.lock-in h1{font-size:clamp(28px,4vw,44px)}
.lock-in .lead{color:var(--muted);max-width:60ch;margin:0}
.lock-ico{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 0 60px rgba(var(--emb-rgb),.25)}
.lock-ico svg{width:40px;height:40px;color:var(--ember)}

/* ---------- Licença ---------- */
.lic-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:18px}
.panel{border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:20px}
.panel h3{font-size:16px;margin-bottom:10px}
.count{display:flex;gap:10px;margin:10px 0 6px}
.count div{flex:1;min-width:0;border-radius:14px;background:#0b0f15;border:1px solid var(--line);padding:12px 8px;text-align:center}
.count b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(var(--acc-rgb),.4)}
.count small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.status-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;
  font-size:13px;padding:6px 12px;border-radius:9px;background:var(--amber-soft);color:var(--amber)}
.status-tag.ok{background:rgba(61,220,151,.12);color:var(--ok)}
.status-tag.bad{background:rgba(255,77,94,.12);color:var(--bad)}
.devid{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border-radius:12px;background:#0b0f15;border:1px dashed #2a3444;
  font-family:var(--font-display);font-size:17px;letter-spacing:.1em;justify-content:space-between}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
.plan{position:relative;border-radius:22px;padding:22px 20px;background:linear-gradient(180deg,#141a25,#0e1219);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;text-align:left;transition:.2s}
.plan:hover{transform:translateY(-4px);border-color:#3a4658}
.plan.best{border-color:rgba(var(--acc-rgb),.55);box-shadow:0 20px 60px rgba(var(--acc-rgb),.14)}
.plan .tagx{position:absolute;top:-11px;right:16px;font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:8px;background:var(--amber);color:#1a1206}
.plan h3{font-size:18px}
.plan .price{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.plan .price small{font-size:14px;color:var(--muted);font-weight:600}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13.5px}
.plan ul li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--amber);margin-right:8px;vertical-align:middle}
.plan .btn{margin-top:auto}

/* ---------- Redes sociais 3D ---------- */
.socials{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;perspective:900px}
.s3d{--c1:#ff8a3d;--c2:#d6246e;--depth:#5a1030;width:96px;display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.s3d .cube{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;position:relative;transform-style:preserve-3d;
  background:linear-gradient(145deg,var(--c1),var(--c2));
  transform:rotateX(18deg) rotateY(-16deg);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;
  box-shadow:1px 1px 0 var(--depth),2px 2px 0 var(--depth),3px 3px 0 var(--depth),4px 4px 0 var(--depth),5px 5px 0 var(--depth),
    6px 6px 0 var(--depth),7px 7px 0 var(--depth),8px 8px 0 var(--depth),14px 22px 30px rgba(0,0,0,.55)}
.s3d .cube::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%);mix-blend-mode:screen}
.s3d .cube svg{width:38px;height:38px;color:#fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform:translateZ(18px)}
.s3d:hover .cube,.s3d:focus-visible .cube{transform:rotateX(0) rotateY(0) translateY(-6px) scale(1.06);
  box-shadow:1px 1px 0 var(--depth),2px 2px 0 var(--depth),3px 3px 0 var(--depth),0 26px 40px rgba(0,0,0,.6),0 0 40px var(--c1)}
.s3d:active .cube{transform:translateY(2px) scale(.97)}
.s3d b{font-size:13px}
.s3d small{font-size:11.5px;color:var(--muted);margin-top:-8px}
.s3d.wa{--c1:#3ee07f;--c2:#0f9d58;--depth:#08502c}
.s3d.ig2{--c1:#ffb23f;--c2:#ff5a36;--depth:#6b200f}
.s3d.ig3{--c1:#8a7dff;--c2:#d6246e;--depth:#3b0f4a}

/* ---------- Toasts ---------- */
.toasts{position:fixed;right:18px;bottom:calc(var(--mini) + 14px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:11px 15px;border-radius:12px;background:#151b26;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.5);
  font-size:13.5px;max-width:360px;animation:tin .25s ease-out}
.toast.ok{border-color:rgba(61,220,151,.4)}
.toast.bad{border-color:rgba(255,77,94,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .5s}
.splash.out{opacity:0;pointer-events:none}
.splash .ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--amber),var(--ember),transparent 70%);animation:spin 1.2s linear infinite;-webkit-mask:radial-gradient(circle,transparent 52px,#000 53px)}
.splash .lbl{position:absolute;text-align:center}
.splash .lbl b{font-family:var(--font-display);letter-spacing:.3em;font-size:18px;display:block;margin-top:190px}
.splash .lbl small{color:var(--muted);letter-spacing:.2em}

/* ---------- Responsivo ---------- */
@media (max-width:1100px){.fs-body{grid-template-columns:1fr}.fs-side{max-height:34vh}.lic-hero{grid-template-columns:1fr}}
@media (max-width:820px){
  :root{--top:60px;--mini:76px}
  .app{grid-template-columns:1fr;grid-template-rows:var(--top) auto 1fr 64px;
    grid-template-areas:"top" "banner" "main" "rail"}
  .rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;justify-content:space-around}
  .rail .sp{display:none}
  .rail button{padding:6px 4px;flex:1}
  .rail button svg{width:22px;height:22px}
  .clock .t{font-size:24px}
  .brand-txt span{display:none}
  .top-right .pill.hide-sm{display:none}
  .mini{grid-template-columns:1fr auto;gap:10px}
  .mini .side{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .plans{grid-template-columns:1fr}
  .fs-clock .t{font-size:44px}
  .fs-body{padding:0 16px 16px}
  .toasts{bottom:calc(var(--mini) + 76px)}
}
@media (max-width:420px){.brand-txt{display:none}.main{padding:14px 16px 24px}.banner-zone{padding:0 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:820px){
  .clock .d{font-size:9.5px;letter-spacing:.1em;white-space:nowrap}
  .devid{font-size:14px;letter-spacing:.06em}
  .crumbs .cur{display:none}
  .view-head h1{font-size:26px}
}

/* ======================= LISTA (layout só nomes) ======================= */
.glist{display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.gl-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto 22px;gap:14px;align-items:center;padding:10px 16px;min-height:66px;
  border-bottom:1px solid rgba(31,39,51,.7);text-align:left;width:100%;transition:background .15s}
.gl-row:last-child{border-bottom:0}
.gl-row:hover{background:#141a24}
.gl-row .bd{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:16px;position:relative;overflow:hidden}
.gl-row b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.gl-row small{color:var(--muted);font-size:12.5px}
.gl-row .tg{font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:7px;background:var(--amber-soft);color:var(--amber)}
.gl-row svg.chev{width:20px;height:20px;color:var(--muted)}
.gl-row.loading b{height:12px;width:40%;border-radius:6px;background:#1a2230}

/* ======================= REGULAGENS ======================= */
.dsp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dsp-head h1{font-size:30px}
.dsp-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.dsp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dsp-tabs::-webkit-scrollbar{display:none}
.dsp-tabs button{flex:none;height:40px;padding:0 15px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.dsp-tabs button svg{width:18px;height:18px}
.dsp-tabs button.on{color:var(--amber);border-color:rgba(var(--acc-rgb),.45);background:var(--amber-soft)}
.dsp-tabs button.ai{color:#c9b8ff;border-color:rgba(160,130,255,.35)}
.dsp-tabs button.ai.on{background:rgba(140,110,255,.16);color:#d9ccff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 9px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.chip i{width:12px;height:12px;border-radius:4px;flex:none}
.chip.on{color:var(--ink);border-color:var(--c,var(--amber));box-shadow:0 0 0 1px var(--c,var(--amber)) inset, 0 0 18px -6px var(--c,var(--amber))}
.chip small{font-weight:600;color:var(--muted);font-size:11px}
.sendfx{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.sendfx i{width:8px;height:8px;border-radius:50%;background:#2a3444;transition:.2s}
.sendfx.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}

.graph{position:relative;border-radius:18px;background:#0a0d13;border:1px solid var(--line);overflow:hidden;margin-bottom:14px;touch-action:none}
.graph canvas{display:block;width:100%;height:280px}
.graph .legend{position:absolute;left:12px;top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);pointer-events:none}
.graph .legend span{display:inline-flex;align-items:center;gap:5px}
.graph .legend span i{width:10px;height:3px;border-radius:2px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ctl{display:grid;grid-template-columns:110px 1fr 92px;gap:12px;align-items:center;padding:8px 0}
.ctl label{font-size:12.5px;color:var(--muted);font-weight:700}
.ctl input[type=range]{width:100%}
.numbox{display:flex;align-items:center;height:36px;border-radius:10px;background:#0b0f15;border:1px solid var(--line);overflow:hidden}
.numbox input{width:100%;min-width:0;height:100%;background:transparent;border:0;color:var(--ink);text-align:right;padding:0 4px;font-variant-numeric:tabular-nums;font-weight:700;outline:none}
.numbox span{padding:0 8px 0 2px;color:var(--muted);font-size:11.5px}
.numbox:focus-within{border-color:var(--amber)}
select.sel{height:38px;border-radius:10px;background:#0b0f15;border:1px solid var(--line);color:var(--ink);padding:0 10px;width:100%;outline:none}
select.sel:focus{border-color:var(--amber)}
.tog{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;font-weight:800;font-size:12.5px;letter-spacing:.04em;
  background:#0b0f15;border:1px solid var(--line);color:var(--muted)}
.tog.on{color:#06130c;background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px -2px rgba(61,220,151,.6)}
.tog.warn.on{color:#1a1206;background:var(--amber);border-color:var(--amber);box-shadow:0 0 14px -2px rgba(var(--acc-rgb),.6)}
.tog.bad.on{color:#fff;background:var(--bad);border-color:var(--bad)}

/* mesa: canais verticais */
.mixer{display:grid;grid-template-columns:repeat(8,minmax(104px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.strip{border-radius:16px;background:linear-gradient(180deg,#121823,#0d1118);border:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative}
.strip::before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.strip .nm{font-weight:800;font-size:12.5px;text-align:center;line-height:1.2;min-height:30px;display:grid;place-items:center;width:100%;overflow-wrap:anywhere}
.strip .role{font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:-6px}
.fader{position:relative;height:190px;width:84px;display:grid;place-items:center;padding-right:24px}
.fader input[type=range]{writing-mode:vertical-lr;direction:rtl;width:8px;height:180px;padding:0;margin:0;background:#1b2330}
.fader input[type=range]::-webkit-slider-thumb{width:36px;height:18px;border-radius:5px;background:linear-gradient(180deg,#f2f4f7,#9aa3b1);box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 -2px 0 rgba(0,0,0,.25)}
.fader input[type=range]::-moz-range-thumb{width:36px;height:18px;border-radius:5px;background:#d6dae0}
.fader .scale{position:absolute;right:0;top:5px;bottom:5px;display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:#56607a;pointer-events:none}
.strip .val{font-family:var(--font-display);font-weight:700;color:var(--amber);font-size:15px}
.strip .row2{display:flex;gap:6px;width:100%}
.strip .row2 .tog{flex:1;justify-content:center;padding:0 4px}
.strip .smini{font-size:11px;color:var(--muted);text-align:center;line-height:1.35}
.strip .smini b{color:var(--ink);font-weight:700}

/* EQ gráfico vertical */
.geq{display:grid;grid-template-columns:repeat(15,minmax(44px,1fr));gap:6px;overflow-x:auto;padding:14px 10px 10px;border-radius:18px;background:#0a0d13;border:1px solid var(--line)}
.geq .bd{display:flex;flex-direction:column;align-items:center;gap:6px}
.geq .bd input[type=range]{writing-mode:vertical-lr;direction:rtl;width:6px;height:200px;background:linear-gradient(180deg,#1b2330 0 49.5%,#3a4658 49.5% 50.5%,#1b2330 50.5%)}
.geq .bd input[type=range]::-webkit-slider-thumb{width:26px;height:14px;border-radius:4px;background:var(--amber);box-shadow:0 0 12px rgba(var(--acc-rgb),.6)}
.geq .bd b{font-family:var(--font-display);font-size:13px;color:var(--amber)}
.geq .bd small{font-size:11px;color:var(--muted);font-weight:700}

.peq-table{display:flex;flex-direction:column;gap:8px}
.peq-row{display:grid;grid-template-columns:34px 64px minmax(130px,1.1fr) minmax(110px,1fr) minmax(100px,.9fr) minmax(90px,.8fr);gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:#0d1118;border:1px solid var(--line)}
.peq-row .n{font-family:var(--font-display);font-weight:700;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#0b0f15}
.peq-row.sel{border-color:var(--amber)}
.matrix{border-collapse:separate;border-spacing:6px;width:100%}
.matrix th{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-align:center}
.matrix th.rowh{text-align:left;color:var(--ink);font-size:13px;letter-spacing:0}
.matrix td{text-align:center}
.mx{width:46px;height:40px;border-radius:10px;background:#0b0f15;border:1px solid var(--line);display:inline-grid;place-items:center}
.mx.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 14px -2px rgba(var(--acc-rgb),.6)}
.mx.on svg{color:#1a1206}
.mx svg{width:18px;height:18px;color:transparent}

/* assistente */
.ai-hero{border-radius:22px;padding:20px;margin-bottom:14px;border:1px solid rgba(160,130,255,.3);
  background:radial-gradient(500px 200px at 10% 0%,rgba(140,110,255,.22),transparent 70%),radial-gradient(400px 200px at 100% 100%,rgba(var(--acc-rgb),.12),transparent 70%),var(--panel)}
.ai-hero h2{font-size:22px}
.ai-hero p{color:var(--muted);margin:6px 0 0;max-width:70ch}
.tip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:#0d1118;border:1px solid var(--line)}
.tip .lv{font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:7px}
.tip .lv.p{background:rgba(255,77,94,.15);color:var(--bad)}
.tip .lv.a{background:var(--amber-soft);color:var(--amber)}
.tip .lv.d{background:rgba(140,110,255,.16);color:#c9b8ff}
.tip .lv.ok{background:rgba(61,220,151,.14);color:var(--ok)}
.tip b{display:block}
.tip small{color:var(--muted);font-size:12.5px}
.rta canvas{height:300px}
.dist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
@media (max-width:820px){.ctl{grid-template-columns:90px 1fr 84px}.peq-row{grid-template-columns:30px 56px 1fr 1fr;}.peq-row .q,.peq-row .ty{grid-column:span 2}}
.gl-row svg.chev{transform:rotate(180deg)}

@media (max-width:1100px){.mixer{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.mixer{grid-template-columns:repeat(2,minmax(0,1fr))}.dsp-tabs button{height:36px;padding:0 11px;font-size:12.5px}}
/* ---- capas personalizadas ---- */
.modal.wide{width:min(860px,100%)}
.art.has-cover b,.fs-cover.has-cover b{display:none}
.art.has-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45))}
.head-cover{border:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s}
.head-cover:active{transform:scale(.96)}
.cv-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cv-prev{width:120px;height:120px;border-radius:18px;flex:none;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.cv-msg{color:var(--muted);font-size:13px;margin:10px 0 0}
.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin-top:16px}
.cv-it{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:6px;cursor:pointer;color:var(--ink);text-align:left;min-height:130px}
.cv-it img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#0b0f15}
.cv-it small{display:block;font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-it:hover,.cv-it:focus-visible{border-color:var(--amber);outline:none}
.cv-it.loading{animation:pulse 1.2s infinite ease-in-out;min-height:140px}
@keyframes pulse{50%{opacity:.45}}
/* ---- voltímetro ---- */
#volt{cursor:pointer}
.pill.blink i{animation:vbl .7s infinite alternate}
@keyframes vbl{to{opacity:.2}}
.vbig{font-family:var(--font-display,inherit);font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.vbig.ok{color:var(--ok)} .vbig.warn{color:var(--amber)} .vbig.bad{color:var(--bad)}
.vspark{width:100%;height:120px;display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:14px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.vgrid .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.vsw{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.vsw input{width:20px;height:20px;accent-color:var(--amber)}
#valert{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:14px 18px;border-radius:18px;background:linear-gradient(135deg,#5a0d18,#2a070c);border:1px solid var(--bad);color:#fff;
  box-shadow:0 0 0 4px rgba(255,77,94,.18),0 20px 50px rgba(0,0,0,.6);animation:valin .3s ease-out;max-width:calc(100% - 24px)}
#valert b{font-size:16px}
@keyframes valin{from{transform:translate(-50%,-30px);opacity:0}}
.field.cv-row{display:flex;gap:8px;align-items:stretch;margin:0}
.cv-row input{flex:1;min-width:0}
.cv-row .btn{flex:none}
a.btn{text-decoration:none}
/* lista de aparelhos (app Android) */
.pick-list{display:grid;gap:8px;margin-top:6px;max-height:50vh;overflow:auto}
.pick-wait{color:var(--muted);margin:10px 0}
.pick-it{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;text-align:left}
.pick-it b{font-size:16px} .pick-it small{color:var(--muted)}

@media (max-width:820px){.app{grid-template-rows:minmax(var(--top),auto) auto 1fr 64px}}

/* ===== v1.2 — fonte do processador, voltímetro, regulagens organizadas ===== */
.pill.stale{opacity:.6} .pill.stale i{background:var(--muted);box-shadow:none}
.vbig.stale{color:var(--muted)}
#srcpill{cursor:pointer}
#m-sub.srcwarn{color:var(--amber)}
.srcseg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.srcseg button{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;color:var(--muted);font-weight:700;font-size:13.5px;background:transparent;border:0}
.srcseg button svg{width:18px;height:18px}
.srcseg button.on{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.45)}
.srcseg.big button{height:46px;padding:0 18px;font-size:14.5px}
.src-panel{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.src-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.src-it{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.src-it svg{grid-row:1/3;width:30px;height:30px;color:var(--muted)}
.src-it b{font-size:17px}.src-it small{color:var(--muted);font-size:12.5px}
.src-it.on{border-color:rgba(var(--acc-rgb),.6);background:var(--amber-soft)}
.src-it.on svg,.src-it.on b{color:var(--amber)}
.src-it:disabled{opacity:.55}
.src-msg{color:var(--muted);font-size:13px;margin:12px 0 0;min-height:1.2em}
.vcal{margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.vcal h4{margin:0 0 2px;font-size:14px}
.vcal #voffs{margin:0 0 10px;color:var(--amber);font-weight:700;font-size:13px}
.vrow{display:flex;gap:8px}.vrow input{flex:1;min-width:0}
.vzero{margin-top:12px;width:100%}

/* Regulagens: cabeçalho e navegação em grupos (ordem do caminho do som) */
.dsp-head{align-items:center}
.dsp-title h1{margin:0}
.dsp-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dsp-meta .tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em}
.dsp-meta .tag i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dsp-meta .tag.ok{color:var(--ok)} .dsp-meta .tag.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dsp-meta .tag.warn{color:var(--amber)} .dsp-meta .tag.warn i{background:var(--amber)}
.dsp-meta .tag.bad{color:var(--bad)} .dsp-meta .tag.bad i{background:var(--bad)}
.dsp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn-group{display:inline-flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.btn-group .btn{border:0;border-radius:0;height:42px}
.btn-group .btn+.btn{border-left:1px solid var(--line)}
.dsp-nav{display:grid;grid-template-columns:2fr 2fr 3fr 3fr;gap:10px;margin-bottom:12px}
.dsp-grp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;min-width:0}
.dsp-grp.cur{border-color:rgba(var(--acc-rgb),.35)}
.dsp-grp-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 4px 8px}
.dsp-grp-h b{display:grid;place-items:center;width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.07);font-size:10.5px;letter-spacing:0;color:var(--ink)}
.dsp-grp.cur .dsp-grp-h{color:var(--amber)} .dsp-grp.cur .dsp-grp-h b{background:var(--amber);color:#1a1206}
.dsp-grp-b{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.dsp-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:62px;padding:8px 6px;border-radius:11px;background:var(--panel-2);border:1px solid transparent;color:var(--muted);font-weight:700;font-size:12.5px;line-height:1.15;text-align:center;cursor:pointer}
.dsp-tab svg{width:20px;height:20px}
.dsp-tab:hover{color:var(--ink);border-color:var(--line)}
.dsp-tab.on{color:var(--amber);background:var(--amber-soft);border-color:rgba(var(--acc-rgb),.5);box-shadow:inset 0 -3px 0 var(--amber)}
.dsp-crumb{display:flex;align-items:center;gap:10px;margin:2px 2px 14px;color:var(--muted);font-size:13px}
.dsp-crumb svg{width:18px;height:18px;color:var(--amber)}
.dsp-crumb b{color:var(--ink);font-size:15px}
@media (max-width:1100px){.dsp-nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .dsp-nav{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .dsp-nav::-webkit-scrollbar{display:none}
  .dsp-grp{flex:none;scroll-snap-align:start}
  .dsp-grp-b{grid-template-columns:repeat(var(--n),88px)}
  .dsp-tools{width:100%}.btn-group{flex:1}.btn-group .btn{flex:1;padding:0 10px}
  .src-grid{grid-template-columns:1fr}
}
@media (max-width:1500px){#srcpill .srcl{display:none}}
.top-right{row-gap:6px}
@media (max-width:560px){
  .top-right{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:64vw;scrollbar-width:none}
  .top-right::-webkit-scrollbar{display:none}
  .top-right .pill{flex:none;height:30px;padding:0 10px;font-size:12px}
  .dsp-head{align-items:stretch}
  .dsp-tools{flex-direction:column;align-items:stretch;gap:8px}
  .btn-group .btn{font-size:13px;gap:6px}
}
.seek{cursor:default}
.fmute.muted,.vp-btn.muted,#m-volbtn.muted{color:var(--bad)}
.fmute{flex:none;height:46px}
/* topo limpo: uma barra só com conexão · fonte · volts */
.top-right{flex-wrap:nowrap;gap:8px}
.statusbar{display:flex;align-items:stretch;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);overflow:hidden;flex:none}
.statusbar .pill{height:auto;border:0;border-radius:0;background:transparent;padding:0 14px;font-size:13px}
.statusbar .pill:not(.hidden)~.pill:not(.hidden){border-left:1px solid var(--line)}
.statusbar .pill.btn:hover{background:rgba(255,255,255,.04)}
.statusbar #conn{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconpill{width:40px;height:40px;padding:0;justify-content:center;flex:none}
#licpill{height:40px;flex:none}
@media (max-width:560px){.statusbar{height:34px}.statusbar .pill{padding:0 9px;font-size:12px}.iconpill{display:none}.statusbar #conn{max-width:110px}}
/* voltímetro compacto */
.vmodal{max-height:94vh;overflow:auto;padding:18px 20px}
.vmodal h2{margin-bottom:6px}
.vcompact{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.vcompact .vbig{font-size:50px}
.vcompact #vmm{color:var(--muted);margin:2px 0 0;font-size:13px}
.vcompact #vstat{color:var(--muted);font-size:12px;margin:0 0 8px}
.vcompact .vspark{height:90px}
.vcompact .vnote{color:var(--muted);font-size:11.5px;margin:4px 0 8px}
.vsws{display:flex;gap:14px;flex-wrap:wrap}
.vgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vgrid2 .field label,.vcal .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.vcompact .vcal{margin-top:10px;padding:12px}
.vcompact .vcal .field{margin-bottom:8px}
.vcompact input{height:42px}
.vcompact .vzero{margin-top:4px;height:40px}
@media (max-width:760px){.vcompact{grid-template-columns:1fr}}
/* tocar e rolar: horizontais deixam rolar a tela; faders só mexem pelo botão */
input[type=range]{touch-action:pan-y}
.fader input[type=range],.geq .bd input[type=range]{touch-action:none}
/* mesa: master à esquerda + mutes + luzes */
.mixwrap{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}
.mstrip{background:linear-gradient(180deg,#1a1410,#0d1118);border-color:rgba(var(--acc-rgb),.35)}
.mstrip::before{background:var(--amber)}
.mstrip .tog{width:100%;justify-content:center}
.strip.muted{opacity:.62}
.strip.muted .val{color:var(--bad)}
.tog.mute.on{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 14px -2px rgba(255,77,94,.6)}
.monpanel{display:grid;grid-template-columns:1.6fr 1fr .6fr;gap:16px;margin-bottom:14px;align-items:start}
.monpanel h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mutes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:800;font-size:11px;cursor:pointer}
.mbtn svg{width:18px;height:18px}
.mbtn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.leds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px}
.leds.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.led{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding:5px 8px;border-radius:9px;background:var(--panel-2)}
.led i{width:10px;height:10px;border-radius:50%;background:#3a1418;flex:none}
.led.on{color:#fff}.led.on i{background:#ff2b3d;box-shadow:0 0 10px #ff2b3d}
@media (max-width:1100px){.monpanel{grid-template-columns:1fr}.mutes{grid-template-columns:repeat(9,minmax(54px,1fr));overflow-x:auto}}
@media (max-width:560px){.mixwrap{grid-template-columns:1fr}.mutes{grid-template-columns:repeat(5,1fr)}}
.seek i::after{display:none}
/* Diamante organizado */
.pro-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.pro-title{display:flex;align-items:center;gap:14px}
.pro-title h1{margin:0;font-size:28px}.pro-title p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.dia-gem.sm{width:46px;height:46px;border-radius:14px;flex:none}
.pro-hero2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pro-act{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(var(--acc-rgb),.14),var(--panel) 60%);border:1px solid rgba(var(--acc-rgb),.35);color:var(--ink);cursor:pointer}
.pro-act.ai{background:linear-gradient(135deg,rgba(140,110,255,.18),var(--panel) 60%);border-color:rgba(160,130,255,.4)}
.pro-act b{display:block;font-size:16px}.pro-act small{color:var(--muted);font-size:12.5px}
.pro-tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;width:max-content;max-width:100%}
.pro-tabs button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;color:var(--muted);font-weight:800;font-size:14px;background:transparent;border:0}
.pro-tabs button svg{width:18px;height:18px}
.pro-tabs button em{font-style:normal;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07)}
.pro-tabs button.on{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.45)}
.pro-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.pro-cat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px}
.pro-cat header{display:flex;align-items:center;gap:10px;padding:8px 10px 10px}
.pro-cat header h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;flex:1}
.pro-cat header em{font-style:normal;font-size:11px;color:var(--muted)}
.pc-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--amber-soft);color:var(--amber)}.pc-ic svg{width:16px;height:16px}
.pc-list{display:flex;flex-direction:column;gap:2px}
.tool-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:11px;background:transparent;border:0;color:var(--ink);cursor:pointer}
.tool-row:hover{background:var(--panel-2)}
.tr-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel-2);color:var(--muted)}.tr-ic svg{width:17px;height:17px}
.tr-tx{min-width:0}.tr-tx b{display:block;font-size:14px}.tr-tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-go{color:var(--muted);font-size:22px;line-height:1}
.tool-row.demo .tr-ic{opacity:.7}
@media (max-width:760px){.pro-hero2{grid-template-columns:1fr}.pro-cats{grid-template-columns:1fr}}
/* cores do voltímetro por faixa */
:root{--v-crit:#ff3b4e;--v-low:#ff8a3d;--v-rest:#ffd23f;--v-mid:#3ec6e0;--v-full:#3ddc97;--v-high:#ff4dc4}
.pill.v-crit i{background:var(--v-crit);box-shadow:0 0 10px var(--v-crit)}.pill.v-crit{color:var(--v-crit)}
.pill.v-low i{background:var(--v-low);box-shadow:0 0 10px var(--v-low)}.pill.v-low{color:var(--v-low)}
.pill.v-rest i{background:var(--v-rest);box-shadow:0 0 10px var(--v-rest)}.pill.v-rest{color:var(--v-rest)}
.pill.v-mid i{background:var(--v-mid);box-shadow:0 0 10px var(--v-mid)}.pill.v-mid{color:var(--v-mid)}
.pill.v-full i{background:var(--v-full);box-shadow:0 0 10px var(--v-full)}.pill.v-full{color:var(--v-full)}
.pill.v-high i{background:var(--v-high);box-shadow:0 0 10px var(--v-high)}.pill.v-high{color:var(--v-high)}
.pill.v-crit.blink{animation:vpill .6s infinite alternate}
@keyframes vpill{to{background:rgba(255,59,78,.22)}}
.mvolt.v-crit{color:var(--v-crit)}.mvolt.v-low{color:var(--v-low)}.mvolt.v-rest{color:var(--v-rest)}.mvolt.v-mid{color:var(--v-mid)}.mvolt.v-full{color:var(--v-full)}.mvolt.v-high{color:var(--v-high)}
.vbig.v-crit{color:var(--v-crit)}.vbig.v-low{color:var(--v-low)}.vbig.v-rest{color:var(--v-rest)}.vbig.v-mid{color:var(--v-mid)}.vbig.v-full{color:var(--v-full)}.vbig.v-high{color:var(--v-high)}
.vst{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:8px 0 10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2)}
.vst>svg{width:28px;height:28px}
.vst b{display:block;font-size:15px}.vst small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.vst.v-crit{border-color:var(--v-crit);background:rgba(255,59,78,.14)}.vst.v-crit b,.vst.v-crit>svg{color:var(--v-crit)}.vst.v-crit small{color:#ffd0d4}
.vst.v-crit.blink{animation:vcrit .8s infinite alternate}
@keyframes vcrit{to{background:rgba(255,59,78,.32);box-shadow:0 0 24px rgba(255,59,78,.45)}}
.vst.v-low{border-color:rgba(255,138,61,.5)}.vst.v-low b,.vst.v-low>svg{color:var(--v-low)}
.vst.v-rest{border-color:rgba(255,210,63,.45)}.vst.v-rest b,.vst.v-rest>svg{color:var(--v-rest)}
.vst.v-mid{border-color:rgba(62,198,224,.45)}.vst.v-mid b,.vst.v-mid>svg{color:var(--v-mid)}
.vst.v-high{border-color:rgba(255,77,196,.5)}.vst.v-high b,.vst.v-high>svg{color:var(--v-high)}
.vst.v-full{border-color:rgba(61,220,151,.55);background:linear-gradient(135deg,rgba(61,220,151,.16),var(--panel-2));box-shadow:0 0 22px -6px rgba(61,220,151,.5)}.vst.v-full b{color:var(--v-full)}
.vst.mini{padding:8px 12px}
.vhide{margin-top:8px;height:34px;font-size:13px}
.eqfx{display:flex;align-items:flex-end;gap:3px;width:30px;height:28px}
.eqfx i{flex:1;background:var(--v-full);border-radius:2px;animation:eqb .7s infinite alternate ease-in-out;box-shadow:0 0 8px var(--v-full)}
.eqfx i:nth-child(1){animation-delay:-.2s}.eqfx i:nth-child(2){animation-delay:-.5s}.eqfx i:nth-child(3){animation-delay:-.1s}.eqfx i:nth-child(4){animation-delay:-.4s}.eqfx i:nth-child(5){animation-delay:-.3s}
@keyframes eqb{from{height:20%}to{height:100%}}
.trial-dia{padding:12px 16px}.trial-dia .dia-gem{width:42px;height:42px}
