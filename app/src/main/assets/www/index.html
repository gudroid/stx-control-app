    peq: [63, 160, 400, 1000, 2500, 6300, 12000].map(f => ({ type: 0, f, g: 0, q: 1.4, on: true })),
    lim: { rmsOn: false, rmsAuto: false, rmsThr: -6, att: 5, rmsHold: 50, rmsRel: 300, peakOn: false, peakAuto: false, peakThr: -3, peakHold: 10, peakRel: 100 },
    route: { inA: i % 2 === 0, inB: i % 2 === 1, inC: false, inD: false, mpL: i % 2 === 0, mpR: i % 2 === 1, type: 0 },
    sub: { on: false, freq: 45, gain: 0 },
    dist: 0,
  };
}
function defaultState() {
  return {
    model: 'STX2496BT', masterOn: true, main: 100,
    outs: Array.from({ length: D.OUTS }, (_, i) => defaultOut(i)),
    geq: { preset: 12, g: D.GEQ_F.map(() => 0) },
    inPeq: [63, 160, 400, 1000, 2500, 6300, 12000].map(f => ({ type: 0, f, g: 0, q: 1.4, on: true })),
    inLevel: { lv: [0, 0, 0, 0, 0], on: [true, true, true, true, true] },
    freq: { on: false, f: 50, g: 0 },
    noise: { on: false, g: -20 },
    seq: { outs: [true, true, true], on: 1, off: 1 },
    dimmer: { on: true, v: 80 },
  };
}

/* ---------- byte 3 = qual campo mudou (STX2496BT, família wl1) ----------
   confirmados: nível (saída N = N*2+4, geral 2, master 1), crossover (1,2,4,5,7), paramétrico (1,3,4,5,6),
   gráfico (preset 1, banda i = i+2), limitador (bits 1, limiares/tempos 2..14), realce (1,2,4), ruído (1,2), subgrave (1,2,3) */
const CODES = {
  level: [1, 2, ...Array.from({ length: 8 }, (_, i) => i * 2 + 4), ...Array.from({ length: 8 }, (_, i) => i * 2 + 5)],
  xo: [1, 2, 4, 5, 7], peq: [1, 3, 4, 5, 6], geq: [1, ...D.GEQ_F.map((_, i) => i + 2)],
  lim: [1, 2, 4, 6, 8, 10, 12, 14], delay: Array.from({ length: 8 }, (_, i) => i + 1), phase: Array.from({ length: 8 }, (_, i) => i + 1),
  router: Array.from({ length: 8 }, (_, i) => i + 1), inLevel: [2, 4, 6, 8, 12, 13, 14, 15, 16], freq: [1, 2, 4], noise: [1, 2], sub: [1, 2, 3], seq: [0], dimmer: [0],
};
const PEQ_CODE = { f: 1, g: 3, q: 4, type: 5, on: 6 }, XO_CODE = { preset: 1, hpF: 2, hpT: 4, lpF: 5, lpT: 7 };
const LIM_CODE = { bits: 1, rmsThr: 2, att: 4, rmsHold: 6, rmsRel: 8, peakThr: 10, peakHold: 12, peakRel: 14 };

/* ---------- codificação de cada comando ---------- */
const Enc = {
  level: (s, code = 4) => [D.LEVEL, D.LEN.LEVEL, code, b => { b[4] = s.masterOn ? 1 : 0; b[5] = s.main; let m = 0; s.outs.forEach((o, i) => { if (o.on) m |= 1 << i; }); b[6] = m; s.outs.forEach((o, i) => i16(b, 7 + i * 2, o.level * 10)); }],
  xo: (s, ch, code = 1) => [D.XO + ch, D.LEN.XO, code, b => { const x = s.outs[ch].xo; b[4] = x.preset; i16(b, 5, x.hpF); b[7] = x.hpT; i16(b, 8, x.lpF); b[10] = x.lpT; }],
  delay: (s, code = 1) => [D.DELAY, D.LEN.DELAY, code, b => { b[4] = 1; s.outs.forEach((o, i) => i16(b, 5 + i * 2, o.delay * 10)); }],
  geq: (s, code = 1) => [D.GEQ, D.LEN.GEQ, code, b => { b[4] = s.geq.preset; s.geq.g.forEach((g, i) => { b[5 + i] = Math.round(g * 10) & 255; }); }],
  peqBand: (p, cmd, code = 1) => [cmd, D.LEN.PEQ, code, b => { b[3] = (code & 15) | ((p.type ? 1 : 0) << 4) | ((p.type === 2 ? 1 : 0) << 5) | ((p.on ? 1 : 0) << 6); i16(b, 4, p.f); b[6] = Math.round(p.g * 10) & 255; b[7] = Math.round(p.q * 10) & 255; }],
  peqOut: (s, ch, band, code) => Enc.peqBand(s.outs[ch].peq[band], D.PEQ_OUT + ch * D.BANDS + band, code),
  peqIn: (s, band, code) => Enc.peqBand(s.inPeq[band], D.PEQ_IN + band, code),
  lim: (s, ch, code = 1) => [D.LIM + ch, D.LEN.LIM, code, b => { const l = s.outs[ch].lim;
    b[4] = (l.rmsAuto ? 1 : 0) | (l.rmsOn ? 2 : 0) | (l.peakAuto ? 4 : 0) | (l.peakOn ? 8 : 0);
    i16(b, 5, l.rmsThr * 10); i16(b, 7, l.att * 10); i16(b, 9, l.rmsHold); i16(b, 11, l.rmsRel); i16(b, 13, l.peakThr * 10); i16(b, 15, l.peakHold); i16(b, 17, l.peakRel); }],
  router: (s, code = 1) => [D.ROUTER, D.LEN.ROUTER, code, b => { s.outs.forEach((o, i) => { const r = o.route; b[4 + i] = (r.mpL ? 1 : 0) | (r.mpR ? 2 : 0) | (r.inA ? 4 : 0) | (r.inB ? 8 : 0) | (r.inC ? 16 : 0) | (r.inD ? 32 : 0) | (r.type ? 64 : 0); }); }],
  phase: (s, code = 1) => [D.PHASE, D.LEN.PHASE, code, b => { let m = 0; s.outs.forEach((o, i) => { if (o.phase) m |= 1 << i; }); b[4] = m; }],
  inLevel: (s, code = 2) => [D.INLEVEL, D.LEN.INLEVEL, code, b => { let m = 0; s.inLevel.on.forEach((v, i) => { if (v) m |= 1 << i; }); b[4] = m; for (let i = 0; i < 4; i++) i16(b, 5 + i * 2, s.inLevel.lv[i] * 10); i16(b, 13, s.inLevel.lv[4]); }],
  freq: (s, code = 1) => [D.FREQ, D.LEN.FREQ, code, b => { b[4] = s.freq.on ? 1 : 0; i16(b, 5, s.freq.g * 10); i16(b, 7, s.freq.f); }],
  noise: (s, code = 1) => [D.NOISE, D.LEN.NOISE, code, b => { b[4] = s.noise.on ? 1 : 0; i16(b, 5, s.noise.g * 10); }],
  sub: (s, ch, code = 1) => [D.SUB + ch, D.LEN.SUB, code, b => { const x = s.outs[ch].sub; b[4] = x.on ? 1 : 0; b[5] = x.freq; b[6] = Math.round(x.gain * 10); }],
  seq: (s, code = 0) => [D.SEQ, D.LEN.SEQ, code, b => { b[4] = s.seq.outs.reduce((m, v, i) => m | (v ? 1 << i : 0), 0); b[5] = Math.round(s.seq.on * 2); b[6] = Math.round(s.seq.off * 2); }],
  dimmer: s => [D.DIMMER, D.LEN.DIMMER, s.dimmer.v, b => { b[3] = s.dimmer.v; b[4] = s.dimmer.on ? 1 : 0; }],
};
/* ---------- leitura (mesmo formato, ao contrário) ---------- */
const Dec = {
  level(s, b) { s.masterOn = !!b[4]; s.main = b[5]; s.outs.forEach((o, i) => { o.on = !!(b[6] & (1 << i)); o.level = r16(b, 7 + i * 2) / 10; }); },
  xo(s, ch, b) { const x = s.outs[ch].xo; x.preset = b[4]; x.hpF = r16(b, 5); x.hpT = b[7]; x.lpF = r16(b, 8); x.lpT = b[10]; },
  delay(s, b) { s.outs.forEach((o, i) => { o.delay = r16(b, 5 + i * 2) / 10; }); },
  geq(s, b) { s.geq.preset = b[4]; s.geq.g = D.GEQ_F.map((_, i) => s8(b[5 + i]) / 10); },
  peqBand(p, b) { p.type = (b[3] & 32) ? 2 : (b[3] & 16) ? 1 : 0; p.on = !!(b[3] & 64); p.f = r16(b, 4); p.g = s8(b[6]) / 10; p.q = b[7] / 10; },
  lim(s, ch, b) { const l = s.outs[ch].lim; l.rmsAuto = !!(b[4] & 1); l.rmsOn = !!(b[4] & 2); l.peakAuto = !!(b[4] & 4); l.peakOn = !!(b[4] & 8);
    l.rmsThr = r16(b, 5) / 10; l.att = r16(b, 7) / 10; l.rmsHold = r16(b, 9); l.rmsRel = r16(b, 11); l.peakThr = r16(b, 13) / 10; l.peakHold = r16(b, 15); l.peakRel = r16(b, 17); },
  router(s, b) { s.outs.forEach((o, i) => { const v = b[4 + i]; Object.assign(o.route, { mpL: !!(v & 1), mpR: !!(v & 2), inA: !!(v & 4), inB: !!(v & 8), inC: !!(v & 16), inD: !!(v & 32), type: (v >> 6) & 1 }); }); },
  phase(s, b) { s.outs.forEach((o, i) => { o.phase = !!(b[4] & (1 << i)); }); },
  inLevel(s, b) { s.inLevel.on = [0, 1, 2, 3, 4].map(i => !!(b[4] & (1 << i))); for (let i = 0; i < 4; i++) s.inLevel.lv[i] = r16(b, 5 + i * 2) / 10; s.inLevel.lv[4] = r16(b, 13); },
  freq(s, b) { s.freq.on = !!b[4]; s.freq.g = r16(b, 5) / 10; s.freq.f = r16(b, 7); },
  noise(s, b) { s.noise.on = !!b[4]; s.noise.g = r16(b, 5) / 10; },
  sub(s, ch, b) { const x = s.outs[ch].sub; x.on = !!b[4]; x.freq = b[5]; x.gain = b[6] / 10; },
};

/* =========================================================================
   Estado, envio com espera curta (não engasga o Bluetooth), presets
   ========================================================================= */
const Dsp = {
  s: null, proto: null, _timers: new Map(), sending: 0, listeners: new Set(), readProgress: null, raw: {},
  init(proto) {
    this.proto = proto;
    const saved = Store.get('dsp', null);
    this.s = saved && saved.outs && saved.outs.length === D.OUTS ? Object.assign(defaultState(), saved) : defaultState();
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(w) { this.listeners.forEach(fn => { try { fn(w); } catch (e) { console.error(e); } }); },
  save() { clearTimeout(this._sv); this._sv = setTimeout(() => Store.set('dsp', this.s), 250); },
  // agenda o envio de um comando; mudanças rápidas (arrastar o fader) viram um envio só
  // monta o pacote em cima dos bytes que o aparelho mandou (não apaga o que o app não conhece)
  async write([cmd, len, b3, fill]) {
    const base = this.raw[cmd];
    return this.proto.dspWrite(cmd, len, b3, b => { if (base) for (let i = 4; i < Math.min(base.length, b.length); i++) b[i] = base[i]; fill(b); this.raw[cmd] = new Uint8Array(b); });
  },
  // agenda o envio; mudanças rápidas (arrastar o fader) viram um envio só. codes = quais campos mudaram
  push(key, encFn, codes, wait = 70) {
    this.save();
    clearTimeout(this._timers.get(key));
    this._timers.set(key, setTimeout(async () => {
      this._timers.delete(key);
      this.sending++; this.emit('send');
      try { for (const c of codes) await this.write(encFn(c)); } finally { this.sending--; this.emit('send'); }
    }, wait));
  },
  // sem código = manda todos os campos daquele comando (seguro para correções automáticas)
  send: {
    level: code => Dsp.push('level' + code, c => Enc.level(Dsp.s, c), code == null ? CODES.level : [code]),
    levelOut: ch => Dsp.send.level(ch * 2 + 4), levelOn: ch => Dsp.send.level(ch * 2 + 5),
    xo: (ch, code) => Dsp.push(`xo${ch}.${code}`, c => Enc.xo(Dsp.s, ch, c), code == null ? CODES.xo : [code]),
    delay: ch => Dsp.push('delay' + ch, c => Enc.delay(Dsp.s, c), ch == null ? CODES.delay : [ch + 1]),
    geq: band => Dsp.push('geq' + band, c => Enc.geq(Dsp.s, c), band == null ? CODES.geq : [band + 2]),
    peqOut: (ch, b, code) => Dsp.push(`peq${ch}.${b}.${code}`, c => Enc.peqOut(Dsp.s, ch, b, c), code == null ? CODES.peq : [code]),
    peqIn: (b, code) => Dsp.push(`peqin${b}.${code}`, c => Enc.peqIn(Dsp.s, b, c), code == null ? CODES.peq : [code]),
    lim: (ch, code) => Dsp.push(`lim${ch}.${code}`, c => Enc.lim(Dsp.s, ch, c), code == null ? CODES.lim : [code]),
    router: out => Dsp.push('router' + out, c => Enc.router(Dsp.s, c), out == null ? CODES.router : [out + 1]),
    phase: ch => Dsp.push('phase' + ch, c => Enc.phase(Dsp.s, c), ch == null ? CODES.phase : [ch + 1]),
    inLevel: code => Dsp.push('inlevel' + code, c => Enc.inLevel(Dsp.s, c), code == null ? CODES.inLevel : [code]),
    freq: code => Dsp.push('freq' + code, c => Enc.freq(Dsp.s, c), code == null ? CODES.freq : [code]),
    noise: code => Dsp.push('noise' + code, c => Enc.noise(Dsp.s, c), code == null ? CODES.noise : [code]),
    sub: (ch, code) => Dsp.push(`sub${ch}.${code}`, c => Enc.sub(Dsp.s, ch, c), code == null ? CODES.sub : [code]),
    seq: () => Dsp.push('seq', c => Enc.seq(Dsp.s, c), CODES.seq),
    dimmer: () => Dsp.push('dimmer', () => Enc.dimmer(Dsp.s), [0]),
  },
  allCommands(everyField = true) {
    const s = this.s, list = [], all = (fn, codes) => (everyField ? codes : [codes[0]]).forEach(c => list.push(fn(c)));
    all(c => Enc.level(s, c), CODES.level); all(c => Enc.delay(s, c), CODES.delay); all(c => Enc.phase(s, c), CODES.phase);
    all(c => Enc.router(s, c), CODES.router); all(c => Enc.geq(s, c), CODES.geq); all(c => Enc.inLevel(s, c), CODES.inLevel);
    all(c => Enc.freq(s, c), CODES.freq); all(c => Enc.seq(s, c), CODES.seq); list.push(Enc.dimmer(s));
    for (let ch = 0; ch < D.OUTS; ch++) {
      all(c => Enc.xo(s, ch, c), CODES.xo); all(c => Enc.lim(s, ch, c), CODES.lim); all(c => Enc.sub(s, ch, c), CODES.sub);
      for (let b = 0; b < D.BANDS; b++) all(c => Enc.peqOut(s, ch, b, c), CODES.peq);
    }
    for (let b = 0; b < D.BANDS; b++) all(c => Enc.peqIn(s, b, c), CODES.peq);
    return list;
  },
  async sendAll(onProgress) {
    const list = this.allCommands(true);
    for (let i = 0; i < list.length; i++) { await this.write(list[i]); if (onProgress) onProgress(i + 1, list.length); }
    this.save(); this.emit('all');
  },
  // coloca o estado atual no simulador sem passar pela fila (modo demonstração)
  seedSim(tr) { if (!tr || tr.failRate == null) return; tr.dsp = tr.dsp || new Map(); for (const [c, l, b3, f] of this.allCommands(false)) { const b = new Uint8Array(P.SIZE); b[1] = c; b[2] = l; b[3] = b3; f(b); tr.dsp.set(c, b); } },
  async readAll(onProgress) {
    const s = JSON.parse(JSON.stringify(this.s)); const jobs = [];
    const add = (enc, dec) => jobs.push({ enc, dec });
    add(Enc.level(s), b => Dec.level(s, b)); add(Enc.delay(s), b => Dec.delay(s, b)); add(Enc.phase(s), b => Dec.phase(s, b));
    add(Enc.router(s), b => Dec.router(s, b)); add(Enc.geq(s), b => Dec.geq(s, b)); add(Enc.inLevel(s), b => Dec.inLevel(s, b));
    add(Enc.freq(s), b => Dec.freq(s, b)); add(Enc.noise(s), b => Dec.noise(s, b));
    for (let ch = 0; ch < D.OUTS; ch++) {
      add(Enc.xo(s, ch), b => Dec.xo(s, ch, b)); add(Enc.lim(s, ch), b => Dec.lim(s, ch, b)); add(Enc.sub(s, ch), b => Dec.sub(s, ch, b));
      for (let k = 0; k < D.BANDS; k++) add(Enc.peqOut(s, ch, k), b => Dec.peqBand(s.outs[ch].peq[k], b));
    }
    for (let k = 0; k < D.BANDS; k++) add(Enc.peqIn(s, k), b => Dec.peqBand(s.inPeq[k], b));
    let ok = 0;
    for (let i = 0; i < jobs.length; i++) {
      const [cmd, len, b3] = jobs[i].enc;
      const r = await this.proto.dspRead(cmd, len, 0);
      if (r) { jobs[i].dec(r); this.raw[cmd] = new Uint8Array(r.slice(0, P.SIZE)); ok++; }
      if (onProgress) onProgress(i + 1, jobs.length);
    }
    if (ok) { this.s = s; this.save(); this.emit('all'); }
    return { ok, total: jobs.length };
  },
  // ---- presets salvos no tablet ----
  presets() { return Store.get('dspPresets', []); },
  savePreset(name) { const list = this.presets(); list.unshift({ id: Date.now().toString(36), name, at: Date.now(), s: JSON.parse(JSON.stringify(this.s)) }); Store.set('dspPresets', list.slice(0, 60)); },
  deletePreset(id) { Store.set('dspPresets', this.presets().filter(p => p.id !== id)); },
  async loadPreset(st, onProgress) { this.s = Object.assign(defaultState(), JSON.parse(JSON.stringify(st))); this.emit('all'); await this.sendAll(onProgress); },
  role(o) {
    const x = o.xo, hp = x.hpT ? x.hpF : 0, lp = x.lpT ? x.lpF : 99999;
    if (lp <= 250) return 'sub';
    if (hp >= 1200) return 'tweeter';
    if (hp >= 250 || (lp <= 9000 && hp >= 150)) return 'medio';
    if (lp <= 3000) return 'grave';
    return 'full';
  },
};
const ROLE_NAMES = { sub: 'Sub', grave: 'Grave', medio: 'Médio', tweeter: 'Tweeter', full: 'Faixa toda' };

/* =========================================================================
   Matemática da curva de resposta (para os gráficos)
   ========================================================================= */
const Resp = {
  FS: 48000,
  xo(f, hpF, hpT, lpF, lpT) {
    let db = 0;
    const part = (ratio, t) => {
      const T = D.XO_TYPES[t]; if (!T || T.fam === 'off') return 0;
      const n = T.s / 6;
      if (T.fam === 'lr') return -10 * Math.log10(Math.pow(1 + Math.pow(ratio, n), 2) / 1) / 1 + 0; // LR = Butterworth ao quadrado
      if (T.fam === 'bs') { const r = ratio * 1.25; return -10 * Math.log10(1 + Math.pow(r, 2 * n) * .7 + Math.pow(r, 2) * .3 * Math.min(1, n / 2)); }
      return -10 * Math.log10(1 + Math.pow(ratio, 2 * n));
    };
    db += part(hpF / f, hpT);
    db += part(f / lpF, lpT);
    return db;
  },
  biquad(type, f0, g, q, f) {
    if (!g && type === 0) return 0;
    const A = Math.pow(10, g / 40), w0 = 2 * Math.PI * f0 / this.FS, al = Math.sin(w0) / (2 * Math.max(.1, q)), cw = Math.cos(w0);
    let b0, b1, b2, a0, a1, a2;
    if (type === 1 || type === 2) {
      const sA = 2 * Math.sqrt(A) * al, s = type === 1 ? -1 : 1;
      b0 = A * ((A + 1) - s * (A - 1) * cw + sA); b1 = 2 * s * A * ((A - 1) - s * (A + 1) * cw); b2 = A * ((A + 1) - s * (A - 1) * cw - sA);
      a0 = (A + 1) + s * (A - 1) * cw + sA; a1 = -2 * s * ((A - 1) + s * (A + 1) * cw); a2 = (A + 1) + s * (A - 1) * cw - sA;
    } else { b0 = 1 + al * A; b1 = -2 * cw; b2 = 1 - al * A; a0 = 1 + al / A; a1 = -2 * cw; a2 = 1 - al / A; }
    const w = 2 * Math.PI * f / this.FS, c1 = Math.cos(w), c2 = Math.cos(2 * w), s1 = Math.sin(w), s2 = Math.sin(2 * w);
    const nr = b0 + b1 * c1 + b2 * c2, ni = -(b1 * s1 + b2 * s2), dr = a0 + a1 * c1 + a2 * c2, di = -(a1 * s1 + a2 * s2);
    return 10 * Math.log10((nr * nr + ni * ni) / (dr * dr + di * di));
  },
  peq(bands, f) { let db = 0; for (const p of bands) if (p.on) db += this.biquad(p.type, p.f, p.g, p.q, f); return db; },
  geq(g, f) { let db = 0; D.GEQ_F.forEach((fc, i) => { if (g[i]) db += this.biquad(0, fc, g[i], 1.4, f); }); return db; },
  out(o, f, withPeq = true) { let db = this.xo(f, o.xo.hpF, o.xo.hpT, o.xo.lpF, o.xo.lpT) + (o.on ? o.level : -60); if (withPeq) db += this.peq(o.peq, f); return db; },
};
// grade de frequências logarítmica para desenhar
const FREQS = Array.from({ length: 240 }, (_, i) => 20 * Math.pow(1000, i / 239));

/* =========================================================================
   ASSISTENTE DE ALINHAMENTO — roda no tablet, grátis, sem internet
   ========================================================================= */
const Assist = {
  TARGETS: {
    car: { n: 'Automotiva (grave forte)', fn: f => f < 40 ? 7 : f < 120 ? 7 - (Math.log2(f / 40) / Math.log2(3)) * 5 : f < 250 ? 2 - Math.log2(f / 120) * 2 : f < 1000 ? 0 : -Math.log2(f / 1000) * 1.3 },
    sq: { n: 'Qualidade de som (SQ)', fn: f => f < 60 ? 5 : f < 200 ? 5 - Math.log2(f / 60) * 2.9 : f < 1000 ? 0 : -Math.log2(f / 1000) * 1 },
    spl: { n: 'Paredão / SPL', fn: f => f < 80 ? 10 : f < 200 ? 10 - Math.log2(f / 80) * 6 : f < 2000 ? 2 : 2 - Math.log2(f / 2000) * .8 },
    flat: { n: 'Plana (referência)', fn: () => 0 },
  },
  // ---- medição pelo microfone (RTA em 1/3 de oitava) ----
  rta: { ctx: null, an: null, stream: null, bands: [], avg: null, n: 0, running: false },
  BANDS3: (() => { const out = []; for (let k = -17; k <= 13; k++) out.push(1000 * Math.pow(2, k / 3)); return out; })(), // 20 Hz a 8 kHz... até 20 kHz
  async startMic() {
    const R = this.rta;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Este navegador não libera o microfone.');
    R.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    R.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = R.ctx.createMediaStreamSource(R.stream);
    R.an = R.ctx.createAnalyser(); R.an.fftSize = 16384; R.an.smoothingTimeConstant = .5;
    src.connect(R.an); R.running = true; R.avg = null; R.n = 0;
    R.buf = new Float32Array(R.an.frequencyBinCount);
  },
  stopMic() { const R = this.rta; R.running = false; try { R.stream && R.stream.getTracks().forEach(t => t.stop()); R.ctx && R.ctx.close(); } catch {} R.ctx = null; },
  frame(accumulate) {
    const R = this.rta; if (!R.running || !R.an) return null;
    R.an.getFloatFrequencyData(R.buf);
    const binHz = R.ctx.sampleRate / R.an.fftSize;
    const bands = this.BANDS3.filter(f => f <= 20000).map(fc => {
      const lo = fc / Math.pow(2, 1 / 6), hi = fc * Math.pow(2, 1 / 6);
      let p = 0, c = 0;
      for (let k = Math.max(1, Math.floor(lo / binHz)); k <= Math.ceil(hi / binHz) && k < R.buf.length; k++) { p += Math.pow(10, R.buf[k] / 10); c++; }
      return 10 * Math.log10((p || 1e-12));
    });
    R.bands = bands;
    if (accumulate) { if (!R.avg) R.avg = bands.map(() => 0); R.avg = R.avg.map((v, i) => v + Math.pow(10, bands[i] / 10)); R.n++; }
    return bands;
  },
  averaged() { const R = this.rta; return R.avg && R.n ? R.avg.map(v => 10 * Math.log10(v / R.n)) : null; },
  // normaliza a medição pela região 250 Hz–4 kHz para comparar com a curva-alvo
  normalize(meas, targetFn) {
    const fs = this.BANDS3.filter(f => f <= 20000);
    const diffs = fs.map((f, i) => meas[i] - targetFn(f));
    const ref = fs.map((f, i) => (f >= 250 && f <= 4000 ? diffs[i] : null)).filter(v => v != null);
    const off = ref.reduce((a, b) => a + b, 0) / ref.length;
    return fs.map((f, i) => meas[i] - off);
  },
  geqCorrection(meas, targetFn) {
    const fs = this.BANDS3.filter(f => f <= 20000); const nm = this.normalize(meas, targetFn);
    return D.GEQ_F.map(fc => {
      // média das bandas de 1/3 dentro de ±1/3 oitava do centro do EQ
      const vals = fs.map((f, i) => ({ f, d: nm[i] - targetFn(f) })).filter(x => Math.abs(Math.log2(x.f / fc)) <= .34);
      const dev = vals.reduce((a, x) => a + x.d, 0) / (vals.length || 1);
      let c = -dev * .8;                     // corrige 80% (evita exagero)
      if (fc < 35) c = Math.min(c, 3);       // microfone de tablet mede pouco abaixo de 35 Hz
      return Math.round(clamp(c, -12, 6) * 2) / 2; // prefere cortar a reforçar
    });
  },
  // ---- alinhamento temporal: distâncias até o ouvido do motorista ----
  delaysFromDistances(dists) {
    const valid = dists.filter(d => d > 0); if (!valid.length) return null;
    const max = Math.max(...valid);
    return dists.map(d => d > 0 ? Math.round((max - d) / 34.3 * 10) / 10 : 0); // som: 34,3 cm por milissegundo
  },
  // ---- diagnóstico: revisa tudo e sugere correções ----
  diagnose(s) {
    const tips = []; const add = (lv, t, d, fix) => tips.push({ lv, t, d, fix });
    const outs = s.outs.map((o, i) => ({ o, i, role: /\bsub/i.test(o.name) ? 'sub' : /tweet/i.test(o.name) ? 'tweeter' : Dsp.role(o) }));
    const nm = i => `${s.outs[i].name} (saída ${i + 1})`;
    const LR24 = XT('lr', 24);
    for (const { o, i, role } of outs) {
      if (!o.on) continue;
      const x = o.xo;
      if (/tweet/i.test(o.name) && (!x.hpT || x.hpF < 1200))
        add('p', `Tweeter sem proteção em ${nm(i)}`, `O corte de graves está ${x.hpT ? 'em ' + x.hpF + ' Hz' : 'desligado'}. Grave no tweeter queima a bobina.`, () => { x.hpF = Math.max(x.hpF, 2500); x.hpT = LR24; x.preset = 0; Dsp.send.xo(i); });
      if (role === 'tweeter' && x.hpT && D.XO_TYPES[x.hpT].s < 24)
        add('a', `Corte suave demais no tweeter (${nm(i)})`, `${D.XO_TYPES[x.hpT].n} deixa passar grave. Use 24 dB ou mais.`, () => { x.hpT = LR24; x.preset = 0; Dsp.send.xo(i); });
      if (role === 'sub' && (!x.lpT || x.lpF > 160))
        add('a', `Sub tocando médios em ${nm(i)}`, 'Sem corte de agudos o sub "fala" e embola a voz. Sugestão: 80 Hz em 24 dB.', () => { x.lpF = 80; x.lpT = LR24; x.preset = 0; Dsp.send.xo(i); });
      if (role === 'sub' && (!x.hpT || x.hpF < 20))
        add('d', `Sem filtro subsônico em ${nm(i)}`, 'Um corte em 25–30 Hz protege o alto-falante de excursão inútil e ganha pressão útil.', () => { x.hpF = 28; x.hpT = XT('bt', 12); x.preset = 0; Dsp.send.xo(i); });
      if (o.level > 0) add('a', `Nível acima de 0 dB em ${nm(i)}`, `Está em +${o.level} dB. Pode distorcer o sinal antes do módulo.`, () => { o.level = 0; Dsp.send.levelOut(i); });
      if (role === 'tweeter' && !o.lim.peakOn && !o.lim.rmsOn)
        add('d', `Limitador desligado no tweeter (${nm(i)})`, 'Ligue o limitador de pico para proteger em volume alto.', () => { o.lim.peakOn = true; o.lim.peakThr = -3; Dsp.send.lim(i); });
      const hot = o.peq.filter(p => p.on && p.g > 6);
      if (hot.length) add('a', `Reforço forte no paramétrico de ${nm(i)}`, `${hot.map(p => p.f + ' Hz +' + p.g + ' dB').join(', ')}. Prefira cortar o que sobra a reforçar o que falta.`);
      const sharp = o.peq.filter(p => p.on && p.g > 3 && p.q > 6);
      if (sharp.length) add('d', `Filtro muito estreito com reforço em ${nm(i)}`, 'Q alto com reforço soa "apitado". Use Q até 4 para reforços.');
      if (o.sub.on && o.sub.gain > 6) add('a', `Subgrave alto em ${nm(i)}`, `Ganho de ${o.sub.gain} dB no subgrave esquenta a bobina. Comece com 3 dB.`, () => { o.sub.gain = 3; Dsp.send.sub(i); });
    }
    // buracos e sobreposições entre faixas
    const byRole = r => outs.filter(x => x.o.on && x.role === r);
    const present = ['sub', 'grave', 'medio', 'tweeter'].filter(r => byRole(r).length);
    const pairs = present.slice(1).map((r, k) => [present[k], r]); // só faixas vizinhas
    for (const [a, b] of pairs) {
      const A = byRole(a), B = byRole(b); if (!A.length || !B.length) continue;
      const lpA = Math.min(...A.map(x => x.o.xo.lpT ? x.o.xo.lpF : 22000)), hpB = Math.max(...B.map(x => x.o.xo.hpT ? x.o.xo.hpF : 10));
      if (hpB > lpA * 1.6) add('a', `Buraco entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, `${ROLE_NAMES[a]} corta em ${lpA} Hz e ${ROLE_NAMES[b]} só começa em ${hpB} Hz. Falta som nessa faixa.`,
        () => { B.forEach(x => { x.o.xo.hpF = lpA; x.o.xo.preset = 0; Dsp.send.xo(x.i); }); });
      else if (lpA > hpB * 2.2) add('d', `Sobreposição entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, `Os dois tocam de ${hpB} a ${lpA} Hz. Pode dar pico ou cancelamento; aproxime os cortes.`);
      const tA = A[0].o.xo.lpT, tB = B[0].o.xo.hpT;
      if (tA && tB && D.XO_TYPES[tA].fam !== D.XO_TYPES[tB].fam) add('d', `Filtros de tipos diferentes entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, 'No mesmo ponto de corte, use o mesmo tipo dos dois lados (de preferência Linkwitz-Riley 24 dB) para somar certinho.');
      if (tA && tB && D.XO_TYPES[tA].fam === 'lr' && D.XO_TYPES[tA].s === 24 && A[0].o.phase !== B[0].o.phase) add('d', `Fase invertida entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, 'Com Linkwitz-Riley 24 dB os dois lados ficam em fase. Teste ouvindo: a posição com mais grave na região do corte é a certa.');
    }
    if (s.geq.g.some(g => g > 6)) add('a', 'Equalizador gráfico com reforço acima de 6 dB', 'Reforços grandes tiram margem do sinal e causam distorção. Abaixe o resto em vez de subir uma banda.', () => { const mx = Math.max(...s.geq.g); s.geq.g = s.geq.g.map(g => Math.round((g - (mx - 6)) * 2) / 2); Dsp.send.geq(); });
    if (s.outs.every(o => !o.delay) && s.outs.filter(o => o.on).length > 2) add('d', 'Sem alinhamento temporal', 'Os falantes estão a distâncias diferentes de você. Use "Alinhar tempo" abaixo com uma fita métrica: o palco fica centralizado.');
    if (!tips.length) add('ok', 'Nada de errado encontrado', 'Os cortes, níveis e proteções estão coerentes. Agora vale medir com o microfone.');
    const order = { p: 0, a: 1, d: 2, ok: 3 };
    return tips.sort((x, y) => order[x.lv] - order[y.lv]);
  },
};

/* =========================================================================
   BIBLIOTECA: leitura do pendrive em blocos, cache e organização automática
   ========================================================================= */
const GENRES = [
  ['FORRÓ', ['forro', 'pe de serra', 'xote', 'baiao'], 'nordeste'],
  ['PISEIRO', ['piseiro', 'pisadinha'], 'nordeste'],
  ['VAQUEJADA', ['vaquejada'], 'nordeste'],
  ['PAGODE', ['pagode', 'pagodao'], 'samba'],
  ['SAMBA', ['samba'], 'samba'],
  ['SWING', ['swing', 'swingueira'], 'samba'],
  ['SERTANEJO', ['sertanejo', 'sertaneja', 'modao', 'universitario'], 'sert'],
  ['ARROCHA', ['arrocha'], 'sert'],
  ['BREGA', ['brega', 'bregadeira'], 'brega'],
  ['MELODY', ['melody', 'tecnomelody', 'tecno melody'], 'brega'],
  ['FUNK', ['funk', 'mandela', 'baile'], 'funk'],
  ['RAP / TRAP', ['rap', 'trap', 'hip hop', 'hiphop'], 'funk'],
  ['ELETRÔNICA', ['eletronica', 'eletronico', 'electro', 'house', 'edm', 'techno', 'automotivo'], 'ele'],
  ['AXÉ', ['axe'], 'axe'],
  ['REGGAE', ['reggae', 'regueiro'], 'reg'],
  ['ROCK', ['rock'], 'rock'],
  ['POP', ['pop'], 'pop'],
  ['GOSPEL', ['gospel', 'louvor'], 'gos'],
  ['MPB', ['mpb'], 'mpb'],
  ['FLASHBACK', ['flashback', 'anos 80', 'anos 90', '80 e 90'], 'flash'],
  ['KIZOMBA', ['kizomba', 'zouk'], 'kiz'],
  ['INTERNACIONAL', ['internacional', 'international'], 'int'],
];
const GENRE_RX = GENRES.map(([name, words, fam]) => ({ name, fam, rx: new RegExp('(^|[^a-z0-9])(' + words.map(w => w.replace(/ /g, '\\s*')).join('|') + ')([^a-z0-9]|$)') }));
function genreOf(text) { const n = norm(text); for (const g of GENRE_RX) if (g.rx.test(n)) return g; return null; }
const SEP_RX = /^\s*([^_\-–:/\\|]{2,30}?)\s*(?:\s[-–]\s|_|:|\/|\\|\|)\s*(.+)$/;

const Organizer = {
  build(folders) {
    const groups = new Map(); const byFolder = new Map();
    const add = (gname, f, display) => {
      if (!groups.has(gname)) groups.set(gname, { key: gname, name: gname, folders: [], songs: 0 });
      const g = groups.get(gname); g.folders.push({ id: f.id, display }); g.songs += f.count || 0; byFolder.set(f.id, gname);
    };
    let scope = null; // pasta vazia que funciona como "pai" (ex.: FORRÓ com as bandas dentro)
    for (let i = 0; i < folders.length; i++) {
      const f = folders[i];
      if (!f || !f.loaded) continue;
      const name = f.name || (f.id === 0 ? 'Pasta principal' : `Pasta ${f.id + 1}`);
      if (!f.count) {
        const next = folders[i + 1];
        if (next && next.loaded && next.count) { const g = genreOf(name); scope = { name: g ? g.name : name.toUpperCase(), fam: g && g.fam }; }
        continue;
      }
      const m = name.match(SEP_RX);
      const gSep = m && genreOf(m[1]);
      if (gSep) { scope = null; add(gSep.name, f, m[2].trim()); continue; }
      // padrão "ESTILO - Artista" com estilo em maiúsculas que não está na lista: usa o próprio nome
      if (m && m[1] === m[1].toUpperCase() && /[A-ZÀ-Ú]{3}/.test(m[1])) { scope = null; add(m[1].trim(), f, m[2].trim()); continue; }
      const g = genreOf(name);
      if (scope && (!g || g.fam === scope.fam || g.name === scope.name)) { add(scope.name, f, name); continue; }
      scope = null;
      add(g ? g.name : 'OUTRAS', f, name);
    }
    const list = [...groups.values()].sort((a, b) => (a.key === 'OUTRAS') - (b.key === 'OUTRAS') || b.songs - a.songs);
    list.forEach(g => g.folders.sort((a, b) => a.display.localeCompare(b.display, 'pt-BR')));
    return { groups: list, byFolder };
  },
};

const Library = {
  proto: null, sig: '', folders: [], names: new Map(), total: { folders: 0, songs: 0 }, org: { groups: [], byFolder: new Map() },
  phase: 'idle', loadedFolders: 0, priority: [], listeners: new Set(), _token: 0, error: '',
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(what, data) { this.listeners.forEach(fn => { try { fn(what, data); } catch (e) { console.error(e); } }); },
  folder(id) { return this.folders[id]; },
  folderOfSong(idx) { return this.folders.find(f => f && f.loaded && idx >= f.first && idx < f.first + f.count); },
  displayName(id) {
    const f = this.folders[id]; if (!f) return '';
    const g = this.org.byFolder.get(id); const grp = g && this.org.groups.find(x => x.key === g);
    const e = grp && grp.folders.find(x => x.id === id); return (e && e.display) || f.name;
  },
  songTitle(idx) {
    const n = this.names.get(idx); if (!n) return `Faixa ${idx + 1}`;
    return n.replace(/\.(mp3|wma|wav|flac|aac|m4a)$/i, '').replace(/^\d{1,3}\s*[-_.]\s*/, '').trim() || n;
  },
  keyOf(idx) { const f = this.folderOfSong(idx); return `${f ? f.name : '?'}::${this.names.get(idx) || idx}`; },
  resolve(key, fallback) {
    const [fn, sn] = key.split('::');
    const f = this.folders.find(x => x && x.loaded && x.name === fn);
    if (f) for (let i = f.first; i < f.first + f.count; i++) if (this.names.get(i) === sn) return i;
    return fallback;
  },
  _save() {
    clearTimeout(this._st);
    this._st = setTimeout(() => {
      const data = { f: this.folders.filter(x => x && x.loaded).map(x => [x.id, x.name, x.first, x.count]), n: [...this.names.entries()] };
      try { localStorage.setItem('stxc.lib:' + this.sig, JSON.stringify(data)); } catch {}
    }, 400);
  },
  _loadCache() {
    try {
      const raw = localStorage.getItem('stxc.lib:' + this.sig); if (!raw) return 0;
      const d = JSON.parse(raw);
      for (const [id, name, first, count] of d.f) this.folders[id] = { id, name, first, count, loaded: true };
      for (const [i, n] of d.n) this.names.set(i, n);
      return d.f.length;
    } catch { return 0; }
  },
  reorganize() { this.org = Organizer.build(this.folders); },
  prioritize(id) { this.priority = [id, ...this.priority.filter(x => x !== id)]; },
  async scan(proto) {
    this.proto = proto; const token = ++this._token;
    if (proto.t && proto.t.off) { this.phase = 'offline'; this.folders = []; this.names = new Map(); this.total = { folders: 0, songs: 0 }; this.org = Organizer.build([]); this.emit('phase'); return; }
    this.phase = 'status'; this.error = ''; this.emit('phase');
    const st = await proto.status();
    if (token !== this._token) return;
    if (!st) { this.phase = 'error'; this.error = 'O processador não respondeu.'; this.emit('phase'); return; }
    if (!st.connected || !st.folders) { this.phase = 'nousb'; this.emit('phase'); return; }
    this.total = { folders: st.folders, songs: st.songs };
    this.sig = `${st.folders}-${st.songs}`;
    this.folders = Array.from({ length: st.folders }, (_, id) => ({ id, loaded: false }));
    this.names = new Map();
    const fromCache = this._loadCache();
    this.loadedFolders = this.folders.filter(f => f.loaded).length;
    this.reorganize();
    this.phase = 'folders'; this.emit('phase'); this.emit('folders');
    if (fromCache) this.emit('toast', `Pendrive reconhecido: ${fromCache} pastas carregadas do cache.`);
    // 1) pastas em blocos de 6, sem travar a tela
    const BLOCK = 6;
    while (token === this._token) {
      const pending = [...this.priority.filter(id => this.folders[id] && !this.folders[id].loaded),
        ...this.folders.filter(f => !f.loaded).map(f => f.id)];
      const block = [...new Set(pending)].slice(0, BLOCK);
      if (!block.length) break;
      for (const id of block) {
        const r = await proto.folder(id, this.priority.includes(id));
        if (token !== this._token) return;
        this.folders[id] = r ? { ...r, id, loaded: true } : { id, name: `Pasta ${id}`, first: 0, count: 0, loaded: true, failed: true };
        // pasta 0 = raiz do pendrive (sem nome): não é uma pasta de músicas quando existem outras
        if (id === 0 && r && !r.name && this.folders.length > 1) this.folders[0].count = 0;
      }
      this.loadedFolders = this.folders.filter(f => f.loaded).length;
      this.reorganize(); this._save();
      this.emit('folders', block);
      await sleep(16);
    }
    // 2) nomes das músicas em segundo plano, pasta por pasta (a pasta aberta tem prioridade)
    this.phase = 'names'; this.emit('phase');
    const order = this.org.groups.flatMap(g => g.folders.map(x => x.id));
    while (token === this._token) {
      const next = [...this.priority, ...order].find(id => { const f = this.folders[id]; return f && f.count && !this._folderNamed(f); });
      if (next == null) break;
      await this.ensureNames(next, false, token);
      await sleep(30);
    }
    if (token === this._token) { this.phase = 'done'; this.emit('phase'); this._save(); }
  },
  _folderNamed(f) { for (let i = f.first; i < f.first + f.count; i++) if (!this.names.has(i)) return false; return true; },
  async ensureNames(id, priority = true, token = this._token) {
    const f = this.folders[id]; if (!f || !f.loaded || !f.count || !this.proto) return;
    if (priority) this.prioritize(id);
    const B = 8;
    for (let s = f.first; s < f.first + f.count; s += B) {
      const idxs = []; for (let i = s; i < Math.min(s + B, f.first + f.count); i++) if (!this.names.has(i)) idxs.push(i);
      if (!idxs.length) continue;
      for (const i of idxs) { const n = await this.proto.fileName(i, priority); if (token !== this._token) return; if (n) this.names.set(i, n); }
      this.emit('names', id); this._save();
    }
    this.priority = this.priority.filter(x => x !== id);
  },
  search(q) {
    const n = norm(q); if (n.length < 2) return { folders: [], songs: [] };
    const folders = this.folders.filter(f => f && f.loaded && f.count && norm(f.name).includes(n)).slice(0, 12);
    const songs = []; for (const [i, name] of this.names) if (norm(name).includes(n)) { songs.push(i); if (songs.length > 120) break; }
    return { folders, songs: songs.sort((a, b) => a - b) };
  },
};

/* =========================================================================
   PLAYER: tocar com verificação, fila, histórico, favoritos e playlists
   ========================================================================= */
const Player = {
  proto: null, idx: -1, playing: false, pos: 0, dur: 0, mode: 0, vol: 20, folderName: '',
  queue: [], history: Store.get('hist', []), favs: new Set(Store.get('favs', [])), playlists: Store.get('pls', []),
  listeners: new Set(), _lastPos: 0, _busy: false,
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(w, d) { this.listeners.forEach(fn => { try { fn(w, d); } catch (e) { console.error(e); } }); },
  volt: null,
  attach(proto) {
    this.proto = proto; proto.onEvent = b => this._event(b);
    if (!this._watch) this._watch = setInterval(() => { const was = this.playing; this.playing = Date.now() - (this._posAt || 0) < 2600; if (was !== this.playing) this.emit('tick'); }, 1000);
  },
  // avisos que o processador manda sozinho (confirmado na gravação do app oficial)
  _event(b) {
    if (b[1] === P.VOLT) { const raw = u16(b, 3) / 100; if (raw > 0 && raw < 400) { this.voltRaw = raw; this.volt = Volt.fix(raw); Volt.sample(this.volt); this.emit('volt'); } return; }
    if (b[1] !== P.CMD) return;
    const sub = b[3], idx = u16(b, 4);
    if (sub === P.EV_TRACK) {
      if (idx === this.idx) return;
      console.log('[player] processador trocou para', idx, 'antes', this.idx, this._req ? '(pedido do app)' : '(sozinho)');
      const prev = this.idx, prevNearEnd = this.dur > 0 && this.pos >= this.dur - 3;
      this.idx = idx; this.pos = 0; this._lastPos = 0; this.curName = '';
      if (this._req) return; // troca pedida pelo app: quem confirma é o playTrack
      // a música anterior terminou sozinha e há fila: toca a próxima da fila (uma vez só)
      if (this.queue.length && prevNearEnd && prev >= 0 && Date.now() - this._lastQueued > 4000) return this._playQueued();
      this._pushHistory(idx); this.emit('track');
    } else if (sub === P.EV_TIME) {
      const pos = u16(b, 6), dur = u16(b, 10);
      if (pos !== this.pos) this._posAt = Date.now();
      this.pos = pos; this.dur = dur || this.dur;
      // o aviso de tempo também traz o número da faixa: só corrige depois de 2 avisos iguais e sem pedido em andamento
      if (idx !== this.idx && !this._req) { if (this._tIdx === idx && ++this._tCnt >= 2) { this.idx = idx; this.curName = ''; this._pushHistory(idx); this.emit('track'); } else if (this._tIdx !== idx) { this._tIdx = idx; this._tCnt = 1; } }
      else this._tCnt = 0;
      this.emit('tick');
    } else if (sub === P.EV_NAME) {
      const n = latin1(b, 6); if (n) { if (!Library.names.has(idx)) Library.names.set(idx, n); if (idx === this.idx || !this.curName) { this.curName = n; this.emit('track'); } }
    } else if (sub === P.EV_FOLDER) {
      this.folderName = latin1(b, 6);
    }
  },
  curName: '', _req: 0, _reqN: 0, _lastQueued: 0, _tIdx: -1, _tCnt: 0,

  _resolve(it) { return typeof it === 'number' ? it : Library.resolve(it.k, it.i); },
  // confere pelo aviso de "música atual" (código 21) que o processador manda ao trocar de faixa
  async _verify(target, n, ms = 1800) {

  },
  // um pedido por vez: tocar outra música cancela o pedido anterior (antes os dois brigavam e a faixa ia e voltava)
  async playTrack(idx, { silent = false, keepQueue = false } = {}) {
    if (idx == null || idx < 0 || !this.proto) return false;
    const n = ++this._reqN; this._req = n;
    console.log('[player] tocar', idx, 'pedido', n, silent ? '(fila)' : '');
    if (!keepQueue) this.queue = this.queue.filter(x => !x.auto), this.emit('queue');
    const pr = this.proto, data = [idx & 255, idx >> 8];
    const cur = this.idx; if (cur === idx) this.idx = -1; // força a confirmação mesmo tocando a mesma
    const play = () => pr.cmd(P.PLAY_ID, data, true, 1); // o app oficial manda "tocar" com tipo 1

      ['reenvio', play],
      ['fonte USB', async () => { await pr.cmd(P.SOURCE, [0]); await sleep(400); if (n === this._reqN) await play(); }],
    ];
    let ok = false, used = 0;
    for (let a = 0; a < ways.length && !ok; a++) {

      used = a; console.log('[player] tentativa', ways[a][0], 'faixa', idx); await ways[a][1](); ok = await this._verify(idx, n, a ? 2200 : 1800);

    } else this.emit('toast', { kind: 'bad', text: silent ? 'A próxima da fila não tocou. Tente pela lista.' : 'Não consegui tocar essa faixa. Confira se o pendrive está na fonte USB.' });

  },
  async toggle() { await this.proto.cmd(P.PLAYPAUSE); this.playing = !this.playing; if (this.playing) this._posAt = Date.now(); else this._posAt = 0; this.emit('tick'); },
  // próxima/anterior/pasta: o processador avisa a faixa nova sozinho (código 21)
  async next() { this._reqN++; this._req = 0; if (this.queue.length) return this._playQueued(); await this.proto.cmd(P.NEXT); },
  async prev() { this._reqN++; this._req = 0; await this.proto.cmd(P.PREV); },
  async folderStep(dir) { this._reqN++; this._req = 0; await this.proto.cmd(dir > 0 ? P.NEXT_FOLDER : P.PREV_FOLDER); },
  async setMode(m) { this.mode = m; await this.proto.cmd(P.MODE, [m]); this.emit('tick'); },

  async seek(pct) { await this.proto.cmd(P.SEEK, [Math.round(pct * 100)]); this.pos = Math.round(this.dur * pct); this._lastPos = this.pos; this.emit('tick'); },

  enqueue(idx, next = false) { const it = { k: Library.keyOf(idx), i: idx }; next ? this.queue.unshift(it) : this.queue.push(it); this.emit('queue'); },
  removeQueued(n) { this.queue.splice(n, 1); this.emit('queue'); },
  upcoming(n = 12) {

      i++;

  },
  isFav(idx) { return this.favs.has(Library.keyOf(idx)); },
  toggleFav(idx) { const k = Library.keyOf(idx); this.favs.has(k) ? this.favs.delete(k) : this.favs.add(k); Store.set('favs', [...this.favs]); this.emit('favs'); return this.favs.has(k); },
  createPlaylist(name) { const pl = { id: Date.now().toString(36), name, items: [] }; this.playlists.push(pl); this._savePl(); return pl; },
  addToPlaylist(id, idx) { const pl = this.playlists.find(p => p.id === id); if (!pl) return; const k = Library.keyOf(idx); if (!pl.items.some(x => x.k === k)) pl.items.push({ k, i: idx }); this._savePl(); },
  removeFromPlaylist(id, n) { const pl = this.playlists.find(p => p.id === id); if (pl) { pl.items.splice(n, 1); this._savePl(); } },
  deletePlaylist(id) { this.playlists = this.playlists.filter(p => p.id !== id); this._savePl(); },
  renamePlaylist(id, name) { const pl = this.playlists.find(p => p.id === id); if (pl) { pl.name = name; this._savePl(); } },
  _savePl() { Store.set('pls', this.playlists); this.emit('pls'); },
  async playList(items, shuffle = false) {

const Covers = {
  _mem: new Map(),
  key(kind, name) { return kind + ':' + norm(name || ''); },
  get(k) {
    if (!k) return null;
    if (this._mem.has(k)) return this._mem.get(k);
    let v = null; try { v = localStorage.getItem('stxc.cv:' + k); } catch {}
    this._mem.set(k, v); return v;
  },
  set(k, url) {
    this._mem.set(k, url || null);
    try { if (url) localStorage.setItem('stxc.cv:' + k, url); else localStorage.removeItem('stxc.cv:' + k); }
    catch { UI.toast('Sem espaço para guardar mais capas. Apague alguma capa antiga.', 'bad'); }
  },
  // estilo de fundo: capa escolhida (se houver) ou o degradê automático
  style(k, seed, genre) {
    const c = this.get(k);
    return c ? `background:#111 url("${c.replace(/"/g, '%22')}") center/cover no-repeat` : artStyle(seed, genre);
  },
  // reduz a imagem para ~360 px (guarda leve, funciona sem internet no carro)
  shrink(src, size = 360) {
    return new Promise((res, rej) => {
      const img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const c = document.createElement('canvas'); c.width = c.height = size;
          const s = Math.min(img.naturalWidth, img.naturalHeight), x = (img.naturalWidth - s) / 2, y = (img.naturalHeight - s) / 2;
          c.getContext('2d').drawImage(img, x, y, s, s, 0, 0, size, size);
          res(c.toDataURL('image/jpeg', 0.82));
        } catch (e) { rej(e); }
      };
      img.onerror = () => rej(new Error('Não abriu a imagem'));
      img.src = src;
    });
  },
  fromFile(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => this.shrink(r.result).then(res, rej); r.onerror = () => rej(new Error('Não li o arquivo')); r.readAsDataURL(file); });
  },
  // imagem da internet: tenta guardar a cópia reduzida; se o site não deixar, guarda o link
  async fromUrl(url) { try { return await this.shrink(url); } catch { return url; } },
  _jsonp(url) {
    return new Promise(res => {
      const cb = '__cv' + Math.random().toString(36).slice(2); const s = document.createElement('script');
      const done = d => { delete window[cb]; s.remove(); clearTimeout(t); res(d); };
      const t = setTimeout(() => done(null), 8000);
      window[cb] = d => done(d); s.onerror = () => done(null);
      s.src = url + (url.includes('?') ? '&' : '?') + (url.includes('deezer') ? 'output=jsonp&callback=' : 'callback=') + cb;
      document.head.append(s);
    });
  },
  // busca capas de álbum/artista grátis (iTunes e Deezer, sem cadastro)
  async search(q) {
    const enc = encodeURIComponent(q.trim());
    const [it, dz, da] = await Promise.all([
      this._jsonp(`https://itunes.apple.com/search?term=${enc}&entity=album&limit=20&country=BR`),
      this._jsonp(`https://api.deezer.com/search/album?q=${enc}&limit=20`),
      this._jsonp(`https://api.deezer.com/search/artist?q=${enc}&limit=8`),
    ]);
    const out = [];
    (da && da.data || []).forEach(a => a.picture_xl && out.push({ url: a.picture_xl, title: a.name, sub: 'Artista' }));
    (dz && dz.data || []).forEach(a => a.cover_xl && out.push({ url: a.cover_xl, title: a.title, sub: a.artist && a.artist.name }));
    (it && it.results || []).forEach(a => a.artworkUrl100 && out.push({ url: a.artworkUrl100.replace('100x100bb', '600x600bb'), title: a.collectionName, sub: a.artistName }));
    const seen = new Set(); return out.filter(x => !seen.has(x.url) && seen.add(x.url)).slice(0, 36);
  },
};

  /* ---------- eventos ---------- */
  onLib(w, d) {
    const c = this.cur();
    if (w === 'toast') return this.toast(d);
    if (w === 'phase' || w === 'folders') {
      this.updateScanbar();
      if (w === 'phase' && (Library.phase === 'error' || Library.phase === 'nousb' || Library.phase === 'folders') && c.v === 'lib') return this.renderLibBody();
      const ls = $('#libsub'); if (ls && Library.total.folders) ls.textContent = `${Library.total.folders} pastas · ${Library.total.songs} músicas · organizadas automaticamente por estilo`;
      if (w === 'folders') {
        // atualiza no lugar, mantendo onde você está
        if (c.v === 'lib' && !this.q) { const y = this.main.scrollTop; this.renderLibBody(); this.main.scrollTop = y; }
        else if (c.v === 'genre') { const y = this.main.scrollTop; this.refresh(); this.main.scrollTop = y; }
        else if (c.v === 'folder' && d && d.includes(c.id) && !$('#songlist')) this.refresh();
      }
    }
    if (w === 'names') {
      if (c.v === 'folder' && d === c.id) {
        const f = Library.folder(c.id);
        for (let i = f.first; i < f.first + f.count; i++) {
          const row = document.querySelector(`.row[data-i="${i}"]`);
          if (row && row.classList.contains('skel') && Library.names.has(i)) { row.classList.remove('skel'); row.querySelector('.t b').textContent = Library.songTitle(i); }
        }
      }
      if (c.v === 'lib' && this.q) this.renderLibBody();
      if (Player.idx >= 0) { const f = Library.folderOfSong(Player.idx); if (f && f.id === d) this.paintNow(); }
    }

    if (w === 'tick') this.paintTick();
    if (w === 'queue') this.paintQueue();
  },

/* =========================================================================
   PORTEIRO: decide se o app está liberado, avisa e bloqueia
   ========================================================================= */
const Gate = {
  st: null, _sig: '',
  tick(force) {
    const st = License.evaluate(); this.st = st;
    const sig = st.state + '|' + st.notices.map(n => n.kind + n.text).join() + '|' + (st.until | 0);
    if (force || sig !== this._sig) {
      const changed = this._state && this._state !== st.state; this._state = st.state;
      this._sig = sig; this.paintPill(); this.paintBanners(); this.paintLock(); if (force && UI.cur().v === 'lic') UI.refresh();
      if (changed) Telemetry.ping(st.state); // registra na planilha quando a situação muda (ex.: teste acabou, ativou chave)
    }
    this.paintCount(); this.paintBannerTimes();
  },
  paintPill() {
    const st = this.st, p = $('#licpill'); if (!p) return;
    const left = st.until ? splitTime(st.until - st.now) : null;
    const map = {
      trial: ['warn', `Teste: ${left ? left.d : 0} dias`], active: ['ok', 'Licença ativa'], free: ['ok', 'Liberado'],
      expired: ['bad', 'Aluguel vencido'], trialover: ['bad', 'Teste encerrado'], blocked: ['bad', 'Bloqueado'], update: ['bad', 'Atualizar'],
    };
    const [k, t] = map[st.state] || ['', st.state];
    p.className = 'pill btn ' + k; p.replaceChildren(h('i'), t);
  },
  paintCount() {
    const box = $('#lic-count'); if (!box || !this.st || !this.st.until) return;
    const t = splitTime(this.st.until - this.st.now);
    const bs = box.querySelectorAll('b'); [t.d, pad(t.h), pad(t.m), pad(t.s)].forEach((v, i) => { if (bs[i]) bs[i].textContent = v; });
  },
  paintBanners() {
    const z = $('#banners'); z.replaceChildren();
    for (const n of this.st.notices) {
      if (n.kind === 'update') z.append(h('div', { class: 'banner' }, ic('dl'), h('span', { class: 'grow' }, h('b', {}, n.text), ' Instale por cima, seus dados continuam.'), n.url ? h('a', { class: 'btn primary', href: n.url, target: '_blank', rel: 'noopener' }, 'Baixar') : null));
      else if (n.kind === 'expiring') z.append(h('div', { class: 'banner' }, ic('hist'), h('span', { class: 'grow' }, h('b', {}, n.text), ' Termina em ', h('span', { class: 'num', 'data-until': n.until }, '…'), '.'), h('button', { class: 'btn primary', onclick: () => UI.switchTab('lic') }, 'Renovar')));
      else if (n.kind === 'bad') z.append(h('div', { class: 'banner bad' }, ic('lock'), h('span', { class: 'grow' }, h('b', {}, n.text), n.until ? [' Bloqueio em ', h('span', { class: 'num', 'data-until': n.until }, '…'), '.'] : ''), h('a', { class: 'btn', href: `https://wa.me/${CONFIG.WHATSAPP}`, target: '_blank', rel: 'noopener' }, 'Falar comigo')));
      else z.append(h('div', { class: 'banner' }, ic('info'), h('span', { class: 'grow' }, n.text)));
    }
  },
  paintBannerTimes() {
    document.querySelectorAll('[data-until]').forEach(el => { const t = splitTime(+el.dataset.until - this.st.now); el.textContent = `${t.d}d ${pad(t.h)}h ${pad(t.m)}m ${pad(t.s)}s`; });
  },
  paintLock() {
    const old = $('#lock'); const st = this.st;
    const locked = ['expired', 'trialover', 'blocked', 'update'].includes(st.state);
    if (!locked) { if (old) old.remove(); return; }
    const box = h('div', { class: 'lock', id: 'lock' });
    const inner = h('div', { class: 'lock-in' });
    if (st.state === 'update') {
      inner.append(h('div', { class: 'lock-ico' }, ic('dl')), h('h1', {}, 'Atualização obrigatória'),
        h('p', { class: 'lead' }, st.notes || 'Saiu uma versão nova com correções importantes. Instale por cima desta; suas playlists e favoritos continuam.'),
        st.url ? h('a', { class: 'btn primary', href: st.url, target: '_blank', rel: 'noopener', style: { height: '52px', fontSize: '16px' } }, ic('dl'), 'Baixar nova versão') : null,
        h('a', { class: 'btn', href: `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent('Olá! Preciso do link da atualização do STX Control.')}`, target: '_blank', rel: 'noopener' }, ic('chat'), 'Pedir o link no WhatsApp'));
    } else if (st.state === 'blocked') {
      inner.append(h('div', { class: 'lock-ico' }, ic('lock')), h('h1', {}, 'Acesso bloqueado'),
        h('p', { class: 'lead' }, st.msg || 'Este aparelho foi bloqueado. Fale comigo para regularizar.'),
        UI.devBox(), h('a', { class: 'btn primary', href: `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent('Olá! Meu STX Control foi bloqueado. Código: ' + Device.id)}`, target: '_blank', rel: 'noopener' }, ic('chat'), 'Falar no WhatsApp'));
    } else {
      inner.append(h('div', { class: 'lock-ico' }, ic('lock')),
        h('h1', {}, st.state === 'trialover' ? 'Seu teste grátis terminou' : 'Seu aluguel venceu'),
        h('p', { class: 'lead' }, `Para continuar usando, fale comigo no WhatsApp, escolha o plano e pague pelo PIX. Você recebe uma chave para colar aqui. Suas playlists, favoritos e regulagens continuam guardados.`),
        h('a', { class: 'btn primary', style: { height: '58px', fontSize: '17px', padding: '0 28px' }, href: `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(`Olá! Quero liberar o ${CONFIG.APP}. Meu código do aparelho: ${Device.id}`)}`, target: '_blank', rel: 'noopener' }, ic('chat'), `Falar no WhatsApp ${CONFIG.WHATSAPP_SHOW}`),
        h('div', { style: { width: 'min(520px,100%)', textAlign: 'left' }, class: 'panel' }, h('h3', {}, 'Código deste aparelho'), UI.devBox(), UI.activateBox()),
        UI.plansBox());
    }
    inner.append(UI.socials(), h('small', { style: { color: 'var(--muted)' } }, `${CONFIG.APP} ${CONFIG.VERSION} · ${CONFIG.BRAND}`));
    box.append(inner);
    if (old) old.replaceWith(box); else document.body.append(box);
  },
};

/* =========================================================================
   INÍCIO
   ========================================================================= */
const App = {
  transport: null, proto: null,
  async boot() {
    try { await Device.init(); } catch (e) { console.error(e); }
    await License.initTrial();
    await Remote.loadCached();
    Dsp.init(null);
    UI.init();
    Gate.tick(true);
    // com Bluetooth disponível o app abre esperando o processador (não cai mais na demonstração)
    if (BleTransport.available()) { this.useTransport(new OffTransport()); this.autoConnect(); }
    else {
      this.transport = new SimTransport();
      this.proto = new StxProtocol(this.transport);
      await this.transport.connect();
      Dsp.proto = this.proto; Dsp.seedSim(this.transport);
      this.paintConn();
      Player.attach(this.proto);
      Library.scan(this.proto);
    }
    setTimeout(() => $('#splash').classList.add('out'), 500);
    setTimeout(() => $('#splash') && $('#splash').remove(), 1200);
    // internet: config assinada (bloqueio, versão, preços) e contador de usuários
    // registro na planilha: uma vez por abertura (depois do nome)
    UI.onboard().then(() => Telemetry.ping(Gate.st.state));
    const online = async () => { await Remote.refresh(); Gate.tick(true); };
    online(); setInterval(online, 60000);
    setInterval(() => UI.updateScanbar(), 400);
  },
  paintConn() {
    const tr = this.transport, ble = tr instanceof BleTransport;
    const st = ble ? tr.state : tr && tr.off ? 'none' : 'demo';
    const map = { none: ['bad', 'Toque para conectar'], demo: ['warn', 'Demonstração'], connected: ['ok', tr && tr.name], connecting: ['warn', 'Conectando…'], reconnecting: ['warn', 'Reconectando…'], off: ['bad', 'Desconectado'] };
    const [k, t] = map[st] || ['warn', st];
    for (const id of ['#conn', '#f-conn']) { const el = $(id); if (el) { el.className = (id === '#conn' ? 'pill btn ' : 'pill ') + k; el.replaceChildren(h('i'), t); } }
    try { UI.paintVolt(); } catch {}
  },
  useTransport(tr) {
    this.transport = tr;
    this.proto = new StxProtocol(tr);
    Player.attach(this.proto); Player.idx = -1; Player.queue = []; Player.volt = null; Player.curName = ''; Volt.reset(); UI.paintVolt && UI.paintVolt();
    Dsp.proto = this.proto; Dsp.synced = !(tr instanceof BleTransport);
    this.paintConn();
    Library.scan(this.proto);
    if (UI.cur().v === 'dsp' || UI.cur().v === 'lib') UI.refresh();
  },
  // senha do processador: 4 dígitos + código de conferência (mesma conta do app oficial)
  passPacket(pwd) {
    const b = new Uint8Array(P.SIZE); b[0] = 1; b[1] = P.PASS; b[2] = 0x0D; b[3] = 0;
    const c = [...pwd].map(ch => ch.charCodeAt(0)); c.forEach((x, i) => { b[4 + i] = x; });
    const v = c[0] * c[1] + c[0] * c[1] * c[2] * c[3] - c[2] + c[3];
    b[12] = v & 255; b[13] = (v >> 8) & 255; b[14] = (v >> 16) & 255; b[15] = (v >>> 24) & 255;
    return b;
  },
  // garante a conexão aberta antes de mandar a senha (o processador derruba em ~20 s sem senha)
  async _ensureOpen(tr) {
    if (!tr || !(tr instanceof BleTransport) || tr.connected) return true;
    try { ConnLog.add('i', null, 'Reabrindo a conexão para enviar a senha…'); tr._busy = true; await tr._open(); return true; }
    catch (e) { ConnLog.add('err', null, e.message); return false; }
    finally { tr._busy = false; }
  },
  async _tryPwd(proto, pwd) {
    if (!(await this._ensureOpen(proto.t || proto.transport))) return null;
    const r = await proto.sendWait(this.passPacket(pwd), b => b[1] === P.PASS, 2000);
    ConnLog.add('i', null, r ? `Senha ${pwd.replace(/./g, '•')}: ${r[3] === 1 ? 'aceita' : 'recusada'}` : 'Sem resposta à senha');
    return r;
  },
  async unlock(proto) {
    if (this._unlocking) return this._unlocking;
    this._unlocking = (async () => {
      const saved = Store.get('stxPwd', null);
      const tries = [...new Set([saved, '1234'].filter(Boolean))];
      for (const pwd of tries) {
        const r = await this._tryPwd(proto, pwd);
        if (!r) return true; // aparelho sem senha / não respondeu: segue
        if (r[3] === 1) { Store.set('stxPwd', pwd); return true; }
        if (pwd === saved) Store.set('stxPwd', null);
      }
      // pede a senha que a pessoa usa no app oficial (se cair enquanto digita, reconecta sozinho)
      for (let k = 0; k < 3; k++) {
        const pwd = await UI.ask('Senha do processador', 'A mesma senha do app oficial STX DSP (4 números)');
        if (!pwd) return false;
        if (!/^\d{4}$/.test(pwd.trim())) { UI.toast('A senha tem 4 números.', 'bad'); continue; }
        const r = await this._tryPwd(proto, pwd.trim());
        if (r && r[3] === 1) { Store.set('stxPwd', pwd.trim()); UI.toast('Senha aceita.', 'ok'); return true; }
        UI.toast(r ? 'Senha recusada pelo processador.' : 'O processador não respondeu à senha.', 'bad');
      }
      return false;
    })();
    try { return await this._unlocking; } finally { this._unlocking = null; }
  },
  // ao abrir o app: reconecta sozinho no processador já usado antes (sem precisar escolher na lista)
  async autoConnect() {
    const dev = window.StxNative ? NativeBleTransport.known() : await BleTransport.known(); if (!dev) return;
    ConnLog.add('i', null, `Reconectando em ${dev.name || 'processador'}…`);
    try { await this.connectBle(dev); }
    catch (e) {
      ConnLog.add('err', null, 'Reconexão automática: ' + e.message);
      // fora de alcance: espera o processador aparecer e tenta de novo
      try {
        if (dev.watchAdvertisements && !this._watching) {
          this._watching = true;
          if (window.StxNative) { setTimeout(() => { if (!(this.transport instanceof BleTransport && this.transport.connected)) this.autoConnect(); }, 8000); return; }
          dev.addEventListener('advertisementreceived', async () => { if (this.transport instanceof BleTransport && this.transport.connected) return; this._watching = false; try { await this.connectBle(dev); } catch {} }, { once: true });
          await dev.watchAdvertisements();
        }
      } catch {}
    }
  },
  async connectBle(knownDev) {
    if (!BleTransport.available()) throw new Error('Este navegador não tem Bluetooth web. Abra o app pelo Chrome, no link https.');
    const tr = window.StxNative ? new NativeBleTransport() : new BleTransport();
    tr.onStatus = () => { this.paintConn(); if (tr.state === 'off' && this.transport === tr) UI.toast('Processador desconectado.', 'bad'); };
    tr.onReconnect = async () => { if (this._unlocking) return; if (await this.unlock(this.proto)) { UI.toast('Reconectado.', 'ok'); Library.scan(this.proto); } };
    if (knownDev) await tr.attach(knownDev); else await tr.connect();
    if (this.transport instanceof BleTransport && this.transport !== tr) { try { this.transport.manual = true; } catch {} }
    const proto = new StxProtocol(tr);
    if (!(await this.unlock(proto))) { tr.disconnect(); throw new Error('Senha não confirmada.'); }
    this.useTransport(tr);
    UI.toast(`Conectado em ${tr.name}.`, 'ok');
    this.syncDsp();
  },
  async syncDsp() {
    Dsp.syncing = true; Dsp.emit('sync');
    const r = await Dsp.readAll((a, b) => { Dsp.syncProgress = [a, b]; Dsp.emit('sync'); });
    Dsp.syncing = false; Dsp.synced = r.ok > 0; Dsp.lastRead = r; Dsp.emit('sync');
    if (UI.cur().v === 'dsp') UI.refresh();
  },
  backToDemo() {
    if (this.transport instanceof BleTransport) this.transport.disconnect();
    const sim = new SimTransport(); this.useTransport(sim); Dsp.seedSim(sim);
  },
  rescan(clear) {
    if (clear) { try { Object.keys(localStorage).filter(k => k.startsWith('stxc.lib:')).forEach(k => localStorage.removeItem(k)); } catch {} }
    Library.scan(this.proto);
  },
};

/* =========================================================================
   💎 PLANO DIAMANTE — central de engenharia elétrica e áudio
   Calculadoras com memória de cálculo, alertas e separação entre
   valores CALCULADOS, ESTIMADOS, MEDIDOS e de REFERÊNCIA.
   ========================================================================= */

// ---------- constantes físicas e de referência ----------
const MAT = {
  cu:  { n: 'Cobre',                 rho: 0.01724, a: 0.00393 },   // Ω·mm²/m a 20 °C (IEC 60028)
  cca: { n: 'CCA (alumínio cobreado)', rho: 0.0278, a: 0.00403 }, // ~62% IACS
  al:  { n: 'Alumínio',              rho: 0.0282,  a: 0.00403 },
};
const BAT_TECH = {
  agm:    { n: 'Chumbo-ácido AGM',      dod: 50, k: 1.10, cmax: 1.0, cyc: '300–600',   whkg: '30–40',   vfull: 12.8, lead: true },
  flood:  { n: 'Chumbo-ácido comum',    dod: 50, k: 1.25, cmax: 0.5, cyc: '200–300',   whkg: '30–35',   vfull: 12.7, lead: true },
  carbon: { n: 'Chumbo-carbono',        dod: 60, k: 1.10, cmax: 1.0, cyc: '1.000–2.000', whkg: '30–40', vfull: 12.8, lead: true },
  lfp:    { n: 'Lítio LiFePO4',         dod: 90, k: 1.03, cmax: 1.0, cyc: '2.000–5.000', whkg: '90–160', vfull: 14.4 },
  nmc:    { n: 'Lítio NMC (Li-íon)',    dod: 80, k: 1.03, cmax: 1.0, cyc: '500–1.500',  whkg: '150–250', vfull: 16.8 },
};
const SEC_MM2 = [1.5, 2.5, 4, 6, 10, 16, 21, 25, 35, 42, 50, 53, 70, 95, 120, 150, 185, 240, 300];
const FUSES = [10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 100, 125, 150, 175, 200, 225, 250, 300, 350, 400, 500, 600, 750, 1000];
const J_CABLE = 4;   // A/mm² — referência prática p/ cabo de cobre flexível em uso contínuo
const J_BUS = 2;     // A/mm² — referência prática p/ barramento de cobre sem ventilação forçada
const REGIMES = [
  ['100', 'Senoidal contínuo (pior caso / teste)'], ['50', 'Competição, música muito comprimida'],
  ['25', 'Som alto com música comum'], ['12.5', 'Volume moderado'],
];
const awg2mm2 = n => { const d = 0.127 * Math.pow(92, (36 - n) / 39); return Math.PI * d * d / 4; };
const mm2awg = a => { const d = Math.sqrt(4 * a / Math.PI); return 36 - 39 * Math.log(d / 0.127) / Math.log(92); };
const awgName = n => n <= -1 ? `${-n + 1}/0` : String(n);
const AWG_LIST = [-3, -2, -1, 0, 1, 2, 4, 6, 8, 10, 12, 14, 16, 18];   // -3 = 4/0, -2 = 3/0, -1 = 2/0, 0 = 1/0
const awgLabel = n => n === -3 ? '4/0' : n === -2 ? '3/0' : n === -1 ? '2/0' : n === 0 ? '1/0' : String(n);
const awgArea = n => awg2mm2(n);

// ---------- formatação ----------
const nf = (v, d = 2) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: d });
const nfx = (v, d = 2) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const nextUp = (list, v) => list.find(x => x >= v - 1e-9) ?? null;
const rhoAt = (m, t) => MAT[m].rho * (1 + MAT[m].a * ((t ?? 20) - 20));

// ---------- definição das calculadoras ----------
// campo: [chave, rótulo, unidade, opções] · opções: need (obrigatório), def (valor de referência), sel (lista), step, hint
const F = (k, l, u, o = {}) => ({ k, l, u, ...o });
const CALCS = {};
const defCalc = c => { CALCS[c.id] = c; };

/* 1.1 BATERIAS */
defCalc({
  id: 'bat', cat: 'ele', grp: 'Baterias', name: 'Banco de baterias', icon: 'bolt',
  desc: 'Série/paralelo, tensão, Ah, Wh, autonomia, corrente de descarga e dimensionamento.',
  fields: [
    F('tech', 'Tecnologia', '', { sel: Object.entries(BAT_TECH).map(([k, t]) => [k, t.n]), def: 'agm' }),
    F('vb', 'Tensão nominal de cada bateria', 'V', { need: 1, ph: 'ex.: 12' }),
    F('ah', 'Capacidade de cada bateria (C20)', 'Ah', { need: 1, ph: 'ex.: 100' }),
    F('s', 'Baterias em série', 'un.', { def: 1, step: 1 }),
    F('p', 'Fileiras em paralelo', 'un.', { def: 1, step: 1 }),
    F('load', 'Consumo da carga', 'W', { ph: 'opcional' }),
    F('iload', 'ou corrente da carga', 'A', { ph: 'opcional' }),
    F('dod', 'Descarga máxima permitida (DoD)', '%', { ph: 'padrão da tecnologia' }),
    F('hours', 'Autonomia desejada (para dimensionar)', 'h', { ph: 'opcional' }),
  ],
  run(v, R) {
    const T = BAT_TECH[v.tech] || BAT_TECH.agm, s = v.s || 1, p = v.p || 1, dod = (v.dod || T.dod) / 100;
    const Vt = v.vb * s, Aht = v.ah * p, Wh = Vt * Aht, Whu = Wh * dod;
    R.row('Tensão total do banco', Vt, 'V', 'calc', 2, `V = V_bateria × série = ${nf(v.vb)} × ${s} = ${nf(Vt)} V`);
    R.row('Capacidade total', Aht, 'Ah', 'calc', 1, `Ah = Ah_bateria × paralelo = ${nf(v.ah)} × ${p} = ${nf(Aht)} Ah`);
    R.row('Energia armazenada', Wh, 'Wh', 'calc', 0, `E = V × Ah = ${nf(Vt)} × ${nf(Aht)} = ${nf(Wh, 0)} Wh`);
    R.row('Energia utilizável', Whu, 'Wh', 'est', 0, `E_útil = E × DoD = ${nf(Wh, 0)} × ${nf(dod * 100, 0)}% = ${nf(Whu, 0)} Wh`);
    R.row('Total de baterias', s * p, 'un.', 'calc', 0);
    R.ref(`DoD ${nf(dod * 100, 0)}% ${v.dod ? '(informado)' : '(padrão para ' + T.n + ')'} · expoente de Peukert ${nf(T.k)} (típico)`);
    let I = v.iload, P = v.load;
    if (!I && P) I = P / Vt; if (!P && I) P = I * Vt;
    if (I) {
      R.row('Corrente de descarga', I, 'A', v.iload ? 'calc' : 'calc', 1, v.iload ? '' : `I = P / V = ${nf(P)} / ${nf(Vt)} = ${nf(I, 1)} A`);
      const cr = I / Aht;
      R.row('Taxa de descarga', cr, 'C', 'calc', 2, `C = I / Ah = ${nf(I, 1)} / ${nf(Aht)} = ${nf(cr, 2)} C`);
      const t1 = Whu / P;
      R.row('Autonomia (cálculo simples)', t1 * 60, 'min', 'est', 0, `t = E_útil / P = ${nf(Whu, 0)} / ${nf(P, 0)} = ${nf(t1, 2)} h`);
      if (T.lead) {
        const tp = 20 * Math.pow(Aht / (I * 20), T.k) * dod;
        R.row('Autonomia com efeito Peukert', tp * 60, 'min', 'est', 0, `t = 20 h × (Ah / (I × 20))^k × DoD = 20 × (${nf(Aht)} / ${nf(I * 20, 0)})^${nf(T.k)} × ${nf(dod, 2)} = ${nf(tp, 2)} h`);
      }
      if (cr > T.cmax) R.alert('a', `Descarga de ${nf(cr, 2)} C acima do recomendado para ${T.n} (~${nf(T.cmax)} C contínuo). Aquece, cai a tensão e reduz a vida útil. Aumente as fileiras em paralelo.`);
      if (cr > T.cmax * 3) R.alert('p', 'Corrente muito alta para este banco: risco de aquecimento forte. Confira a corrente máxima no datasheet da bateria.');
    }
    if (v.hours && P) {
      const need = P * v.hours / (Vt * dod), np = Math.ceil(need / v.ah - 1e-9);
      R.row('Capacidade necessária', need, 'Ah', 'calc', 0, `Ah = P × h / (V × DoD) = ${nf(P, 0)} × ${nf(v.hours)} / (${nf(Vt)} × ${nf(dod, 2)}) = ${nf(need, 0)} Ah`);
      R.row('Fileiras em paralelo necessárias', np, 'un.', 'calc', 0, `n = ${nf(need, 0)} / ${nf(v.ah)} → ${np}`);
      R.row('Baterias no total', np * s, 'un.', 'calc', 0);
    }
    if (Vt > 60) R.alert('p', `Banco com ${nf(Vt)} V CC: acima de 60 V há risco de choque. Use proteção nos terminais, chave geral e fusível.`);
    if (p > 1) R.alert('d', 'Em paralelo use baterias iguais (mesma marca, idade e carga) e cabos de mesmo comprimento até o barramento.');
    if (!R.alerts.length) R.alert('ok', 'Banco dentro dos limites informados.');
    R.table('Comparação entre tecnologias (valores típicos de fabricantes)', ['Tecnologia', 'DoD usual', 'Ciclos', 'Wh/kg', 'Descarga contínua'],
      Object.values(BAT_TECH).map(t => [t.n, t.dod + '%', t.cyc, t.whkg, '~' + nf(t.cmax) + ' C']));
  },
});

defCalc({
  id: 'ohm', cat: 'ele', grp: 'Sistemas HV', name: 'Tensão, corrente e potência', icon: 'calc',
  desc: 'Preencha dois valores quaisquer e o app calcula os outros (lei de Ohm e potência).',
  fields: [F('V', 'Tensão', 'V', { ph: 'opcional' }), F('I', 'Corrente', 'A', { ph: 'opcional' }), F('P', 'Potência', 'W', { ph: 'opcional' }), F('R', 'Resistência', 'Ω', { ph: 'opcional' })],
  run(v, R) {
    let { V, I, P, R: r } = v; const n = [V, I, P, r].filter(x => x != null).length;
    if (n < 2) return R.need('Preencha pelo menos dois valores.');
    const how = [];
    if (V != null && I != null) { P = P ?? V * I; r = r ?? V / I; how.push('P = V × I', 'R = V / I'); }
    else if (V != null && r != null) { I = V / r; P = V * V / r; how.push('I = V / R', 'P = V² / R'); }
    else if (V != null && P != null) { I = P / V; r = V * V / P; how.push('I = P / V', 'R = V² / P'); }
    else if (I != null && r != null) { V = I * r; P = I * I * r; how.push('V = I × R', 'P = I² × R'); }
    else if (I != null && P != null) { V = P / I; r = P / (I * I); how.push('V = P / I', 'R = P / I²'); }
    else if (P != null && r != null) { V = Math.sqrt(P * r); I = Math.sqrt(P / r); how.push('V = √(P × R)', 'I = √(P / R)'); }
    R.row('Tensão', V, 'V', 'calc', 3); R.row('Corrente', I, 'A', 'calc', 3); R.row('Potência', P, 'W', 'calc', 2); R.row('Resistência', r, 'Ω', 'calc', 4);
    how.forEach(x => R.step(x));
    if (V > 60) R.alert('p', `${nf(V)} V: tensão perigosa ao toque (acima de 60 V CC).`);
  },
});
defCalc({
  id: 'hvsup', cat: 'ele', grp: 'Sistemas HV', name: 'Fonte HV e alimentação dos amplificadores', icon: 'bolt',
  desc: 'Potência de entrada, corrente no barramento e capacidade de fonte necessária.',
  fields: [
    F('prms', 'Potência RMS total dos amplificadores', 'W', { need: 1, ph: 'ex.: 30000' }),
    F('vbus', 'Tensão do barramento (alimentação)', 'V', { need: 1, ph: 'ex.: 14,4 ou 200' }),
    F('eff', 'Eficiência dos amplificadores', '%', { def: 80, hint: 'Classe D: 75–90% (datasheet)' }),

    if (v.isup) {
      const cap = v.isup * (v.nsup || 1), use = I / cap * 100;

      if (use > 100) R.alert('p', `Fontes insuficientes: o consumo estimado (${nf(I, 0)} A) passa a capacidade (${nf(cap, 0)} A). A tensão vai cair e os amplificadores podem desligar.`);
      else if (use > 80) R.alert('a', `Fontes trabalhando a ${nf(use, 0)}% da capacidade. Pouca folga para picos.`);

    }
    if (v.vbus > 60) R.alert('p', `Barramento de ${nf(v.vbus)} V CC: risco de choque. Isole terminais, use chave geral e descarga dos capacitores antes de mexer.`);
    R.ref('Regime: fração da potência RMS que a música exige em média. Música comum fica bem abaixo do senoidal; competição comprimida chega perto de 50%.');
  },
});
defCalc({
  id: 'vdrop', cat: 'ele', grp: 'Cabos e barramentos', name: 'Queda de tensão', icon: 'calc',
  desc: 'Quanto de tensão se perde no cabo (ida e volta) e a potência que vira calor.',
  fields: [
    F('I', 'Corrente', 'A', { need: 1 }), F('L', 'Comprimento do cabo (só ida)', 'm', { need: 1 }),
    F('A', 'Seção do cabo', 'mm²', { need: 1 }), F('V', 'Tensão do sistema', 'V', { need: 1 }),
    F('mat', 'Material', '', { sel: Object.entries(MAT).map(([k, m]) => [k, m.n]), def: 'cu' }),
    F('t', 'Temperatura do cabo', '°C', { def: 20 }),

  ],
  run(v, R) {
    const rho = rhoAt(v.mat, v.t), k = +v.ret, Rw = k * v.L * rho / v.A, dV = v.I * Rw, pct = dV / v.V * 100, Pl = v.I * v.I * Rw;
    R.row('Resistência do cabo', Rw * 1000, 'mΩ', 'calc', 3, `R = ${k} × L × ρ / A = ${k} × ${nf(v.L)} × ${nf(rho, 5)} / ${nf(v.A)} = ${nf(Rw * 1000, 3)} mΩ`);
    R.row('Queda de tensão', dV, 'V', 'calc', 3, `ΔV = I × R = ${nf(v.I)} × ${nf(Rw, 5)} = ${nf(dV, 3)} V`);
    R.row('Queda percentual', pct, '%', 'calc', 2, `ΔV% = ΔV / V = ${nf(dV, 3)} / ${nf(v.V)} = ${nf(pct, 2)}%`);
    R.row('Tensão na carga', v.V - dV, 'V', 'calc', 2);
    R.row('Perda em calor no cabo', Pl, 'W', 'calc', 1, `P = I² × R = ${nf(Pl, 1)} W`);
    R.ref(`ρ ${MAT[v.mat].n} a ${nf(v.t)} °C = ${nf(rho, 5)} Ω·mm²/m (ρ20 = ${MAT[v.mat].rho}, α = ${MAT[v.mat].a})`);
    if (pct > 5) R.alert('p', `Queda de ${nf(pct, 1)}%: alta demais. Aumente a seção ou encurte o cabo.`);
    else if (pct > 3) R.alert('a', `Queda de ${nf(pct, 1)}%: acima dos 3% recomendados.`);
    else R.alert('ok', 'Queda dentro dos 3% recomendados.');
    if (v.I / v.A > J_CABLE * 1.5) R.alert('p', `Densidade de corrente de ${nf(v.I / v.A, 1)} A/mm²: o cabo vai esquentar demais.`);
  },
});
defCalc({
  id: 'bus', cat: 'ele', grp: 'Cabos e barramentos', name: 'Barramento (busbar)', icon: 'calc',
  desc: 'Seção, resistência, queda, perda e densidade de corrente de barras chatas.',

    R.row('Resistência', Rb * 1000, 'mΩ', 'calc', 4, `R = L × ρ / A = ${nf(v.L)} × ${nf(rho, 5)} / ${nf(A, 1)} = ${nf(Rb * 1000, 4)} mΩ`);
    R.row('Queda de tensão', dV, 'V', 'calc', 3, `ΔV = I × R = ${nf(dV, 3)} V`);
    if (v.V) R.row('Queda percentual', dV / v.V * 100, '%', 'calc', 2);

    else if (J > J_BUS) R.alert('a', 'Acima da densidade de referência: aceitável só para picos curtos.');
