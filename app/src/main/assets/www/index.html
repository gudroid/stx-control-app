defCalc({
  id: 'prech', cat: 'ele', grp: 'Sistemas HV', name: 'Pré-carga de capacitores', icon: 'calc',
  desc: 'Tempo de carga, pico de corrente e potência do resistor de pré-carga.',
  fields: [
    F('C', 'Capacitância total do banco', 'F', { need: 1 }), F('V', 'Tensão de carga', 'V', { need: 1 }),
    F('R', 'Resistor de pré-carga', 'Ω', { ph: 'ou preencha o tempo' }), F('t', 'Tempo desejado até ~99%', 's', { ph: 'opcional' }),
    F('imax', 'Corrente máxima aceitável na ligação', 'A', { ph: 'opcional' }),
  ],
  run(v, R) {
    let r = v.R;
    if (!r && v.t) { r = v.t / (5 * v.C); R.row('Resistor calculado', r, 'Ω', 'calc', 3, `R = t / (5 × C) = ${nf(v.t)} / (5 × ${nf(v.C, 4)}) = ${nf(r, 3)} Ω`); }
    if (!r) return R.need('Informe o resistor ou o tempo desejado.');
    const tau = r * v.C, I0 = v.V / r, E = 0.5 * v.C * v.V * v.V;
    R.row('Constante de tempo τ', tau, 's', 'calc', 3, `τ = R × C = ${nf(r, 3)} × ${nf(v.C, 4)} = ${nf(tau, 3)} s`);
    R.row('Tempo até 99%', 4.6 * tau, 's', 'calc', 2, `t99 = 4,6 × τ = ${nf(4.6 * tau, 2)} s`);
    R.row('Tempo até 99,3% (5τ)', 5 * tau, 's', 'calc', 2);
    R.row('Pico de corrente na ligação', I0, 'A', 'calc', 2, `I0 = V / R = ${nf(v.V)} / ${nf(r, 3)} = ${nf(I0, 2)} A`);
    R.row('Pico de potência no resistor', v.V * v.V / r, 'W', 'calc', 0, `P0 = V² / R = ${nf(v.V * v.V / r, 0)} W`);
    R.row('Energia dissipada no resistor', E, 'J', 'calc', 1, `E = ½ × C × V² = ½ × ${nf(v.C, 4)} × ${nf(v.V)}² = ${nf(E, 1)} J`);
    R.row('Potência média durante a carga', E / (5 * tau), 'W', 'calc', 1, `P_méd = E / 5τ = ${nf(E / (5 * tau), 1)} W`);
    R.row('Resistor sugerido (potência)', Math.max(5, E / (5 * tau) * 2), 'W', 'est', 0);
    R.ref('Use resistor de fio (wirewound) que aguente o pulso; confira a curva de sobrecarga do fabricante. Depois da pré-carga, um relé/contator faz o curto do resistor.');
    if (v.imax && I0 > v.imax) R.alert('a', `Pico de ${nf(I0, 1)} A acima do limite de ${nf(v.imax)} A: aumente o resistor (mín. ${nf(v.V / v.imax, 2)} Ω).`);
    if (v.V > 60) R.alert('p', 'Capacitores carregados guardam tensão perigosa mesmo desligados: instale resistor de descarga e meça antes de mexer.');
    if (E > 500) R.alert('p', `Energia de ${nf(E, 0)} J: um curto nos terminais solta faísca e metal derretido. Nunca ligue sem pré-carga.`);
  },
});

/* 1.3 ULTRACAPACITORES */
defCalc({
  id: 'ucap', cat: 'ele', grp: 'Ultracapacitores', name: 'Banco de ultracapacitores', icon: 'bolt',
  desc: 'Capacitância, tensão, energia, ESR, descarga e balanceamento das células.',
  presets: [['3 V 3000 F · 6 em série (≈18 V)', { vc: 3, cc: 3000, s: 6, p: 1 }], ['3 V 3000 F · 98 em série (≈294 V)', { vc: 3, cc: 3000, s: 98, p: 1 }]],
  fields: [
    F('vc', 'Tensão máxima por célula', 'V', { need: 1, ph: 'ex.: 3' }), F('cc', 'Capacitância por célula', 'F', { need: 1, ph: 'ex.: 3000' }),
    F('esr', 'ESR por célula (datasheet)', 'mΩ', { ph: 'opcional' }), F('leak', 'Corrente de fuga por célula (datasheet)', 'mA', { ph: 'opcional' }),
    F('s', 'Células em série', 'un.', { def: 1, step: 1 }), F('p', 'Fileiras em paralelo', 'un.', { def: 1, step: 1 }),
    F('vsys', 'Tensão de trabalho do sistema', 'V', { ph: 'opcional' }), F('vmin', 'Tensão mínima de uso', 'V', { ph: 'opcional' }),
    F('idis', 'Corrente de descarga', 'A', { ph: 'opcional' }),
  ],
  run(v, R) {
    const s = v.s || 1, p = v.p || 1, Ceq = v.cc * p / s, Vmax = v.vc * s, Vw = v.vsys || Vmax;
    R.row('Capacitância equivalente', Ceq, 'F', 'calc', 3, `C = C_célula × p / s = ${nf(v.cc)} × ${p} / ${s} = ${nf(Ceq, 3)} F`);
    R.row('Tensão máxima do conjunto', Vmax, 'V', 'calc', 2, `V = V_célula × s = ${nf(v.vc)} × ${s} = ${nf(Vmax)} V`);
    const E = 0.5 * Ceq * Vw * Vw;
    R.row(`Energia a ${nf(Vw)} V`, E, 'J', 'calc', 0, `E = ½ × C × V² = ½ × ${nf(Ceq, 3)} × ${nf(Vw)}² = ${nf(E, 0)} J`);
    R.row('Energia em Wh', E / 3600, 'Wh', 'calc', 2, `Wh = J / 3600`);
    R.row('Total de células', s * p, 'un.', 'calc', 0);
    if (v.vmin != null) {
      const Eu = 0.5 * Ceq * (Vw * Vw - v.vmin * v.vmin);
      R.row(`Energia útil (${nf(Vw)} → ${nf(v.vmin)} V)`, Eu, 'J', 'calc', 0, `E_útil = ½ × C × (V² − Vmin²) = ${nf(Eu, 0)} J (${nf(Eu / (0.5 * Ceq * Vw * Vw) * 100, 0)}% do total)`);
      if (v.idis) { const t = Ceq * (Vw - v.vmin) / v.idis; R.row('Tempo de descarga (corrente constante)', t, 's', 'est', 2, `t = C × ΔV / I = ${nf(Ceq, 3)} × ${nf(Vw - v.vmin)} / ${nf(v.idis)} = ${nf(t, 2)} s`); }
    }
    if (v.esr) {
      const esr = v.esr / 1000 * s / p;
      R.row('ESR equivalente', esr * 1000, 'mΩ', 'calc', 3, `ESR = ESR_célula × s / p = ${nf(v.esr)} × ${s} / ${p} = ${nf(esr * 1000, 3)} mΩ`);
      R.row('Potência máxima teórica', Vw * Vw / (4 * esr), 'W', 'est', 0, `P = V² / (4 × ESR) (carga casada, teórico)`);
      if (v.idis) { R.row('Queda instantânea pela ESR', v.idis * esr, 'V', 'calc', 3, `ΔV = I × ESR = ${nf(v.idis)} × ${nf(esr, 5)} = ${nf(v.idis * esr, 3)} V`); R.row('Calor na ESR', v.idis * v.idis * esr, 'W', 'calc', 1, 'P = I² × ESR'); }
    }
    if (v.vsys) {
      const vc = v.vsys / s;
      R.row('Tensão por célula no sistema', vc, 'V', 'calc', 3, `V_célula = V_sistema / s = ${nf(v.vsys)} / ${s} = ${nf(vc, 3)} V`);
      if (vc > v.vc) R.alert('p', `Sobretensão: ${nf(vc, 2)} V por célula passa o máximo de ${nf(v.vc)} V. As células podem estufar ou explodir. Aumente as células em série.`);
      else if (vc > v.vc * 0.95) R.alert('a', `Células a ${nf(vc / v.vc * 100, 0)}% da tensão máxima: sem balanceamento, alguma vai passar do limite.`);
    }
    if (s > 1) {
      if (v.leak) {
        const ib = 10 * v.leak / 1000, rb = v.vc / ib, pb = v.vc * v.vc / rb;
        R.row('Corrente de balanceamento (10× a fuga)', ib * 1000, 'mA', 'calc', 1);
        R.row('Resistor de balanceamento por célula', rb, 'Ω', 'calc', 0, `R = V_célula / I_bal = ${nf(v.vc)} / ${nf(ib, 4)} = ${nf(rb, 0)} Ω`);
        R.row('Potência de cada resistor', pb, 'W', 'calc', 3, `P = V² / R = ${nf(pb, 3)} W (use resistor de pelo menos ${nf(Math.max(pb * 2, 0.25), 2)} W)`);
        R.row('Perda total no balanceamento', pb * s * p, 'W', 'calc', 2);
      }
      R.alert('a', `Com ${s} células em série é obrigatório balancear cada célula (placa de balanceamento ativo ou resistor por célula). Sem isso, as células se desequilibram e uma passa da tensão máxima.`);
    }
    if (Vmax > 60) R.alert('p', `Conjunto de até ${nf(Vmax)} V CC: tensão perigosa. Mantenha descarregado e isolado durante a montagem.`);
    if (E > 2000) R.alert('p', `${nf(E, 0)} J armazenados: curto-circuito libera energia de forma violenta. Use fusível próximo ao banco e pré-carga.`);
  },
});

/* 1.4 GERADORES E RETIFICADORES */
defCalc({
  id: 'gen', cat: 'ele', grp: 'Geradores e retificadores', name: 'Gerador: kVA, kW e corrente', icon: 'bolt',
  desc: 'Conversão kVA ↔ kW, corrente de linha e capacidade de alimentar os amplificadores.',

    F('kva', 'Potência do gerador', 'kVA', { need: 1 }), F('fp', 'Fator de potência', '', { def: 0.8, hint: 'placa do gerador' }),

    F('use', 'Uso contínuo recomendado', '%', { def: 80 }),

    R.row('Corrente nominal de linha', I, 'A', 'calc', 1, v.ph === '3' ? `I = S / (√3 × V) = ${nf(v.kva * 1000, 0)} / (1,732 × ${nf(v.v)}) = ${nf(I, 1)} A` : `I = S / V = ${nf(v.kva * 1000, 0)} / ${nf(v.v)} = ${nf(I, 1)} A`);
    const cont = kw * v.use / 100;
    R.row('Potência para uso contínuo', cont, 'kW', 'est', 2, `${nf(kw, 2)} × ${nf(v.use)}%`);
    if (v.dc) {
      const need = v.dc / (v.eta / 100) / 1000, pct = need / kw * 100;
      R.row('Demanda no gerador', need, 'kW', 'est', 2, `P = P_CC / η = ${nf(v.dc, 0)} / ${nf(v.eta / 100, 2)} = ${nf(need * 1000, 0)} W`);
      R.row('Uso do gerador', pct, '%', 'est', 0);
      R.row('Gerador mínimo recomendado', need / v.fp / (v.use / 100), 'kVA', 'calc', 1, `kVA = kW / FP / uso = ${nf(need, 2)} / ${nf(v.fp)} / ${nf(v.use / 100, 2)}`);
      if (pct > 100) R.alert('p', 'O gerador não aguenta a demanda estimada: a rotação cai e a tensão despenca.');
      else if (pct > v.use) R.alert('a', `Gerador a ${nf(pct, 0)}%: acima dos ${nf(v.use)}% recomendados para uso contínuo.`);
      else R.alert('ok', 'Gerador com folga para a demanda estimada.');
    }

defCalc({
  id: 'rect', cat: 'ele', grp: 'Geradores e retificadores', name: 'Ponte retificadora e dissipador', icon: 'calc',
  desc: 'Tensão CC, corrente por diodo, PIV, dissipação térmica e dissipador necessário.',
  fields: [
    F('vac', 'Tensão CA de entrada (RMS)', 'V', { need: 1, hint: 'trifásico: tensão entre fases' }), F('ph', 'Tipo', '', { sel: [['1', 'Ponte monofásica (4 diodos)'], ['3', 'Ponte trifásica (6 diodos)']], def: '1' }),
    F('idc', 'Corrente CC na saída', 'A', { need: 1 }), F('vf', 'Queda por diodo (datasheet)', 'V', { def: 1.1 }),
    F('n', 'Pontes em paralelo', 'un.', { def: 1, step: 1 }),
    F('rjc', 'Rθ junção–carcaça da ponte (datasheet)', '°C/W', { ph: 'opcional' }), F('rcs', 'Rθ carcaça–dissipador (pasta)', '°C/W', { def: 0.2 }),
    F('tj', 'Temperatura máx. da junção', '°C', { def: 150 }), F('ta', 'Temperatura ambiente', '°C', { def: 50, hint: 'dentro do carro' }),
  ],
  run(v, R) {
    const tri = v.ph === '3', n = v.n || 1, Vpk = Math.SQRT2 * v.vac - 2 * v.vf;
    R.row('Tensão CC de pico (com capacitor)', Vpk, 'V', 'calc', 1, `V = √2 × V_CA − 2 × Vf = 1,414 × ${nf(v.vac)} − 2 × ${nf(v.vf)} = ${nf(Vpk, 1)} V`);
    const Vavg = tri ? 1.35 * v.vac - 2 * v.vf : 0.9 * v.vac - 2 * v.vf;
    R.row('Tensão CC média (sem capacitor)', Vavg, 'V', 'calc', 1, tri ? 'V = 1,35 × V_linha − 2 × Vf' : 'V = 0,9 × V_CA − 2 × Vf');
    const Id = v.idc / n / (tri ? 3 : 2);
    R.row('Corrente média por diodo', Id, 'A', 'calc', 1, `I_diodo = I_CC / pontes / ${tri ? 3 : 2} = ${nf(Id, 1)} A`);
    R.row('Tensão reversa (PIV) por diodo', Math.SQRT2 * v.vac, 'V', 'calc', 0);
    R.row('PIV recomendada (2× de folga)', 2 * Math.SQRT2 * v.vac, 'V', 'calc', 0);
    R.row('Ponte recomendada (corrente)', v.idc / n * 1.5, 'A', 'calc', 0, 'I_ponte ≥ 1,5 × I_CC por ponte');
    const P = 2 * v.vf * v.idc / n;
    R.row('Calor em cada ponte', P, 'W', 'calc', 1, `P = 2 × Vf × I = 2 × ${nf(v.vf)} × ${nf(v.idc / n)} = ${nf(P, 1)} W (sempre 2 diodos conduzindo)`);
    if (v.rjc != null) {
      const rsa = (v.tj - v.ta) / P - v.rjc - v.rcs;
      R.row('Dissipador necessário (Rθ máx.)', rsa, '°C/W', 'calc', 3, `Rθsa = (Tj − Ta) / P − Rθjc − Rθcs = (${nf(v.tj)} − ${nf(v.ta)}) / ${nf(P, 1)} − ${nf(v.rjc)} − ${nf(v.rcs)} = ${nf(rsa, 3)} °C/W`);
      if (rsa <= 0) R.alert('p', 'Nem um dissipador perfeito resolve: divida a corrente em mais pontes ou use ponte de corrente maior.');
      else if (rsa < 0.3) R.alert('a', 'Dissipador muito grande ou ventilação forçada necessária (cooler).');
      else R.alert('ok', `Use dissipador com resistência térmica de até ${nf(rsa, 2)} °C/W.`);
    }
    if (Vpk > 60) R.alert('p', `Saída de ${nf(Vpk, 0)} V CC: perigosa. Isole os terminais e use fusível na saída.`);
  },
});

/* 1.5 CABOS */
defCalc({
  id: 'cable', cat: 'ele', grp: 'Cabos e barramentos', name: 'Bitola do cabo + fusível', icon: 'calc',
  desc: 'Seção mínima pela queda e pela corrente, bitola comercial, AWG, cabos em paralelo e fusível.',
  fields: [
    F('I', 'Corrente', 'A', { need: 1 }), F('L', 'Comprimento (só ida)', 'm', { need: 1 }), F('V', 'Tensão do sistema', 'V', { need: 1 }),
    F('dmax', 'Queda máxima aceita', '%', { def: 3 }), F('mat', 'Material', '', { sel: Object.entries(MAT).map(([k, m]) => [k, m.n]), def: 'cu' }),
    F('t', 'Temperatura do cabo', '°C', { def: 40 }), F('n', 'Cabos em paralelo', 'un.', { def: 1, step: 1 }),
  ],
  run(v, R) {
    const rho = rhoAt(v.mat, v.t), n = v.n || 1, dVmax = v.V * v.dmax / 100;
    const Adrop = 2 * v.L * rho * v.I / dVmax, Aamp = v.I / J_CABLE * (v.mat === 'cu' ? 1 : 1.6), Amin = Math.max(Adrop, Aamp);
    R.row('Seção mínima pela queda', Adrop, 'mm²', 'calc', 1, `A = 2 × L × ρ × I / ΔVmáx = 2 × ${nf(v.L)} × ${nf(rho, 5)} × ${nf(v.I)} / ${nf(dVmax, 3)} = ${nf(Adrop, 1)} mm²`);
    R.row('Seção mínima pela corrente', Aamp, 'mm²', 'est', 1, `A = I / ${J_CABLE} A/mm²${v.mat === 'cu' ? '' : ' × 1,6 (alumínio/CCA)'} = ${nf(Aamp, 1)} mm²`);
    R.row('Seção total necessária', Amin, 'mm²', 'calc', 1);
    const each = Amin / n, com = nextUp(SEC_MM2, each);
    R.row(n > 1 ? `Seção de cada um dos ${n} cabos` : 'Seção mínima do cabo', each, 'mm²', 'calc', 1);
    if (com) {
      R.row('Bitola comercial recomendada', com, 'mm²', 'calc', 0);
      R.row('Equivalente AWG', mm2awg(com), 'AWG', 'ref', 1, `AWG ≈ 36 − 39 × log₉₂(d / 0,127), d = √(4A/π)`);
      const At = com * n, dV = 2 * v.L * rho * v.I / At;
      R.row('Queda real com essa bitola', dV / v.V * 100, '%', 'calc', 2, `ΔV = ${nf(dV, 3)} V`);
      const amp = At * J_CABLE / (v.mat === 'cu' ? 1 : 1.6), fz = nextUp(FUSES, v.I * 1.25);
      R.row('Fusível recomendado', fz, 'A', 'calc', 0, `Fusível ≥ 1,25 × I = ${nf(v.I * 1.25, 0)} A → próximo comercial ${fz} A`);
      R.row('Capacidade do cabo (referência)', amp, 'A', 'est', 0);
      if (fz > amp) R.alert('a', `O fusível de ${fz} A passa a capacidade do cabo (~${nf(amp, 0)} A): suba uma bitola para o fusível proteger o cabo.`);
    } else R.alert('p', 'Seção acima de 300 mm²: divida em cabos em paralelo ou use barramento.');
    R.alert('d', 'O cabo negativo deve ter a mesma seção do positivo. Fusível a no máximo 30 cm da bateria/banco.');
    if (n > 1) R.alert('d', 'Cabos em paralelo: mesmo comprimento, mesma bitola e terminais iguais nas duas pontas.');
    R.ref(`Referência de corrente: ~${J_CABLE} A/mm² para cobre flexível em uso contínuo (picos curtos admitem mais).`);

  desc: 'Impedância final, potência por falante, consumo, corrente e compatibilidade.',
  fields: [

    F('zmin', 'Impedância mínima do amplificador', 'Ω', { ph: 'datasheet' }),
    F('nq', 'Quantidade de alto-falantes', 'un.', { need: 1, step: 1 }), F('zs', 'Impedância de cada falante', 'Ω', { need: 1 }),
    F('lig', 'Ligação', '', { sel: [['par', 'Todos em paralelo'], ['ser', 'Todos em série'], ['sp', 'Série-paralelo']], def: 'par' }),
    F('sp', 'Falantes em série por grupo (série-paralelo)', 'un.', { def: 2, step: 1 }),
    F('prs', 'Potência RMS de cada falante', 'W', { ph: 'opcional' }),
    F('vsup', 'Tensão de alimentação', 'V', { ph: 'opcional' }), F('eff', 'Eficiência', '%', { def: 80 }), F('reg', 'Regime', '', { sel: REGIMES, def: '50' }),
    F('vout', 'Tensão de saída medida (multímetro, CA)', 'V', { ph: 'opcional' }),

  ],
  run(v, R) {
    const n = Math.max(1, v.nq | 0); let Z, how;
    if (v.lig === 'ser') { Z = v.zs * n; how = `Z = Z_falante × n = ${nf(v.zs)} × ${n}`; }
    else if (v.lig === 'sp') { const s = Math.max(1, v.sp | 0), g = Math.floor(n / s); Z = v.zs * s / Math.max(1, g); how = `Z = Z × série / grupos = ${nf(v.zs)} × ${s} / ${g}`; if (g * s !== n) R.alert('a', `${n} falantes não fecham grupos iguais de ${s} em série.`); }
    else { Z = v.zs / n; how = `Z = Z_falante / n = ${nf(v.zs)} / ${n}`; }

    const Pz = v.prms * v.zr / Z;
    R.row('Potência na impedância final', Math.min(Pz, v.prms * 4), 'W', 'est', 0, `P ≈ P_RMS × Z_nominal / Z_final = ${nf(v.prms, 0)} × ${nf(v.zr)} / ${nf(Z, 3)} (amplificador limitado por tensão)`);

    if (v.zmin) { if (Z < v.zmin - 1e-6) R.alert('p', `Impedância final de ${nf(Z, 2)} Ω abaixo do mínimo do amplificador (${nf(v.zmin)} Ω): ele esquenta, entra em proteção ou queima.`); else R.alert('ok', `Impedância de ${nf(Z, 2)} Ω dentro do mínimo do amplificador (${nf(v.zmin)} Ω).`); }
    if (v.vout) { const pm = v.vout * v.vout / Z; R.row('Potência aplicada (medida)', pm, 'W', 'med', 0, `P = V² / Z = ${nf(v.vout)}² / ${nf(Z, 3)} = ${nf(pm, 0)} W`); }

defCalc({

/* ---------- motor de resultado ---------- */
class CalcResult {
  constructor() { this.rows = []; this.steps = []; this.alerts = []; this.refs = []; this.tables = []; this.missing = null; }
  row(l, v, u, k = 'calc', d = 2, step) { this.rows.push({ l, v, u, k, d }); if (step) this.steps.push(step); }
  step(s) { this.steps.push(s); }
  alert(lv, t) { this.alerts.push({ lv, t }); }
  ref(t) { this.refs.push(t); }
  table(title, head, rows) { this.tables.push({ title, head, rows }); }
  need(t) { this.missing = t; }
}
const KIND = { calc: ['CALCULADO', 'k-calc'], est: ['ESTIMADO', 'k-est'], med: ['MEDIDO', 'k-med'], ref: ['REFERÊNCIA', 'k-ref'] };
const LVN = { p: 'PERIGO', a: 'ATENÇÃO', d: 'DICA', ok: 'OK' };

const Pro = {
  hist() { return Store.get('proHist', []); },
  addHist(e) { const l = this.hist(); l.unshift(e); Store.set('proHist', l.slice(0, 120)); },
  inputs(id) { return Store.get('proIn:' + id, {}); },
  setInputs(id, v) { Store.set('proIn:' + id, v); },
  parse(c, raw) {
    const v = {}, miss = [];
    for (const f of c.fields) {
      let x = raw[f.k];
      if (f.sel) { v[f.k] = x != null && x !== '' ? x : String(f.def); continue; }
      if (x == null || x === '') x = f.def != null ? String(f.def) : '';
      const n = parseFloat(String(x).replace(/\./g, (m, i, s) => s.includes(',') ? '' : '.').replace(',', '.'));
      if (x === '' || !isFinite(n)) { v[f.k] = null; if (f.need) miss.push(f.l); } else v[f.k] = n;
    }
    for (const k of Object.keys(v)) if (v[k] != null && typeof v[k] === 'number' && v[k] < 0 && !['t', 'dd'].includes(k)) miss.push('valor negativo');
    return { v, miss };
  },
  compute(c, raw) {
    const { v, miss } = this.parse(c, raw), R = new CalcResult();
    if (miss.length) { R.need('Preencha: ' + [...new Set(miss)].join(', ') + '.'); return R; }
    try { c.run(v, R); } catch (e) { console.error(e); R.need('Não consegui calcular com esses valores.'); }
    return R;
  },
  report(c, raw, R) {
    const L = [`${CONFIG.APP} · Plano Diamante`, `${c.name} — ${new Date().toLocaleString('pt-BR')}`, '', 'DADOS INFORMADOS'];
    c.fields.forEach(f => { const x = raw[f.k]; if (x != null && x !== '') L.push(`• ${f.l}: ${f.sel ? (f.sel.find(o => o[0] === x) || [, x])[1] : x} ${f.u || ''}`.trim()); });
    L.push('', 'RESULTADOS'); R.rows.forEach(r => L.push(`• ${r.l}: ${nf(r.v, r.d)} ${r.u} [${KIND[r.k][0]}]`));
    if (R.alerts.length) { L.push('', 'ALERTAS'); R.alerts.forEach(a => L.push(`• ${LVN[a.lv]}: ${a.t}`)); }
    if (R.steps.length) { L.push('', 'MEMÓRIA DE CÁLCULO'); R.steps.forEach(s => L.push('• ' + s)); }
    if (R.refs.length) { L.push('', 'REFERÊNCIAS'); R.refs.forEach(s => L.push('• ' + s)); }
    L.push('', 'Valores ESTIMADOS dependem de condições reais; confirme com medição.', `Gerado no ${CONFIG.APP} por ${CONFIG.BRAND}`);
    return L.join('\n');
  },
  async share(title, text) {
    try { if (navigator.share) { await navigator.share({ title, text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    UI.copy(text, 'Relatório copiado. Cole no WhatsApp ou onde quiser.');
  },
};

// ---------- gerador de sinais (sai pelo áudio do tablet: P2/Bluetooth/USB) ----------
const SigGen = {
  ctx: null, src: null, gain: null, mode: null, f: 1000, level: -18, sweep: { a: 20, b: 20000, s: 10 },
  _ctx() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  stop() { try { this.src && this.src.stop(); } catch {} try { this.src && this.src.disconnect(); } catch {} this.src = null; this.mode = null; clearTimeout(this._t); },
  _out() { const c = this._ctx(); this.gain = c.createGain(); this.gain.gain.value = Math.pow(10, this.level / 20); this.gain.connect(c.destination); return this.gain; },
  setLevel(db) { this.level = Math.min(-3, db); if (this.gain) this.gain.gain.setTargetAtTime(Math.pow(10, this.level / 20), this.ctx.currentTime, 0.03); },
  setFreq(f) { this.f = f; if (this.mode === 'tone' && this.src) this.src.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.02); },
  tone(f) { this.stop(); const c = this._ctx(), o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f || this.f; o.connect(this._out()); o.start(); this.src = o; this.mode = 'tone'; },
  // ruído rosa: filtro de Paul Kellet (-3 dB/oitava) sobre ruído branco, 10 s em laço
  pink() {
    this.stop(); const c = this._ctx(), n = c.sampleRate * 10, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926; }
    const s = c.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(this._out()); s.start(); this.src = s; this.mode = 'pink';
  },
  // varredura logarítmica (sweep) de a até b em s segundos, repetindo
  sweepRun(onF) {
    this.stop(); const c = this._ctx(), o = c.createOscillator(), { a, b, s } = this.sweep; o.type = 'sine';
    const t0 = c.currentTime + 0.05; o.frequency.setValueAtTime(a, t0); o.frequency.exponentialRampToValueAtTime(b, t0 + s);
    o.connect(this._out()); o.start(t0); o.stop(t0 + s + 0.05); this.src = o; this.mode = 'sweep';
    const tick = () => { if (this.mode !== 'sweep' || this.src !== o) return; const el = c.currentTime - t0; onF && onF(Math.min(b, a * Math.pow(b / a, Math.max(0, el) / s))); if (el < s) this._t = setTimeout(tick, 100); else { this.mode = null; onF && onF(null); } };
    tick();
  },
};

// ---------- medições guardadas ----------
const Meas = {
  list() { return Store.get('meas', []); },
  add(m) { const l = this.list(); l.unshift(m); Store.set('meas', l.slice(0, 20)); },
  del(id) { Store.set('meas', this.list().filter(m => m.id !== id)); },
  // picos e cancelamentos: compara cada banda com a média das vizinhas (±2/3 de oitava)
  features(bands, freqs) {
    const out = [];
    bands.forEach((v, i) => {
      if (freqs[i] < 30 || freqs[i] > 16000) return;
      const nb = bands.slice(Math.max(0, i - 3), i).concat(bands.slice(i + 1, i + 4)); if (nb.length < 4) return;
      const ref = nb.reduce((a, b) => a + b, 0) / nb.length, d = v - ref;
      if (d >= 6) out.push({ f: freqs[i], d, k: 'pico' }); else if (d <= -8) out.push({ f: freqs[i], d, k: 'cancelamento' });
    });
    return out;
  },
};

const PJ_CATS = {

};
const Proj = {
  all() { return Store.get('projects', []); },
  save(p) { const l = this.all().filter(x => x.id !== p.id); l.unshift({ ...p, at: Date.now() }); Store.set('projects', l.slice(0, 30)); },
  del(id) { Store.set('projects', this.all().filter(x => x.id !== id)); },
  blank() { return { id: 'p' + Date.now().toString(36), name: 'Meu som', v: 12.6, regime: '25', items: Object.fromEntries(Object.keys(PJ_CATS).map(k => [k, []])) }; },
  num(x, d) { const n = parseFloat(String(x ?? '').replace(',', '.')); return isFinite(n) ? n : d; },
  // análise completa do sistema
  analyze(p) {
    const R = new CalcResult(), N = this.num, it = p.items, V = N(p.v, 12.6), duty = N(p.regime, 25) / 100;
    const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
    const amps = it.amp.map(a => ({ ...a, qty: N(a.qty, 1), rms: N(a.rms, 0), ohm: N(a.ohm, 2), v: N(a.v, 12.6), eff: N(a.eff, 85) / 100 }));
    const spks = it.spk.map(s => ({ ...s, qty: N(s.qty, 1), rms: N(s.rms, 0), ohm: N(s.ohm, 4) }));
    if (!amps.length && !spks.length) { R.need('Cadastre pelo menos os amplificadores e os alto-falantes para eu analisar.'); return R; }
    const pAmp = sum(amps, a => a.qty * a.rms), pSpk = sum(spks, s => s.qty * s.rms);
    R.row('Potência RMS dos amplificadores', pAmp, 'W', 'calc', 0, `Pamp = Σ(qtd × RMS) = ${nf(pAmp, 0)} W`);
    R.row('Potência RMS dos alto-falantes', pSpk, 'W', 'calc', 0, `Pfal = Σ(qtd × RMS) = ${nf(pSpk, 0)} W`);
    // consumo elétrico
    const pin = sum(amps, a => a.qty * a.rms * duty / Math.max(0.3, a.eff));
    const pinMax = sum(amps, a => a.qty * a.rms / Math.max(0.3, a.eff));
    R.row(`Consumo médio (música, regime ${nf(duty * 100, 1)}%)`, pin, 'W', 'est', 0, `Pent = Σ(qtd × RMS × regime ÷ eficiência) = ${nf(pin, 0)} W`);
    R.row('Consumo no pior caso (senoidal contínuo)', pinMax, 'W', 'est', 0, `Pmáx = Σ(qtd × RMS ÷ eficiência) = ${nf(pinMax, 0)} W`);
    const I = pin / V, Imax = pinMax / V;
    R.row(`Corrente média na tensão do sistema (${nf(V, 1)} V)`, I, 'A', 'est', 0, `I = P ÷ V = ${nf(pin, 0)} ÷ ${nf(V, 1)} = ${nf(I, 0)} A`);
    R.row('Corrente de pico (pior caso)', Imax, 'A', 'est', 0, `Ipico = ${nf(pinMax, 0)} ÷ ${nf(V, 1)} = ${nf(Imax, 0)} A`);
    // casamento amplificador × falante, por tipo
    if (pAmp && pSpk) {
      const r = pAmp / pSpk;
      R.row('Relação potência amplificador ÷ falantes', r, '×', 'calc', 2, `r = ${nf(pAmp, 0)} ÷ ${nf(pSpk, 0)} = ${nf(r, 2)}`);
      if (r > 1.5) R.alert('p', `Os amplificadores somam ${nf(r, 1)}× a potência dos falantes. Com o volume no máximo eles podem queimar falantes; use o limitador do processador.`);
      else if (r < 0.5) R.alert('a', `Os amplificadores entregam só ${nf(r * 100, 0)}% da potência dos falantes. Funciona, mas o som pode clipar (distorcer) antes de render tudo.`);
      else R.alert('ok', 'Potência dos amplificadores compatível com a dos falantes (entre 0,5× e 1,5×).');
    }
    const minAmpOhm = amps.length ? Math.min(...amps.map(a => a.ohm)) : null;
    spks.forEach(s => { if (minAmpOhm != null && s.ohm < minAmpOhm) R.alert('a', `${s.name || PJ_CATS.spk.one} de ${nf(s.ohm, 1)} Ω está abaixo do mínimo de ${nf(minAmpOhm, 1)} Ω dos amplificadores: confira a ligação (série/paralelo) para não forçar o módulo.`); });
    amps.forEach(a => { if (Math.abs(a.v - V) / V > 0.35) R.alert('p', `${a.name || 'Amplificador'} é de ${nf(a.v, 1)} V e o sistema está em ${nf(V, 1)} V. Tensão errada pode queimar o módulo ou limitar a potência.`); });
    // alimentação disponível
    let supplyW = 0, notes = [];
    const hv = it.hv.map(x => ({ q: N(x.qty, 1), v: N(x.v, 0), a: N(x.a, 0) }));
    const hvW = sum(hv, x => x.q * x.v * x.a);
    if (hvW) { R.row('Potência das fontes', hvW, 'W', 'calc', 0, `Pfontes = Σ(qtd × V × A) = ${nf(hvW, 0)} W`); supplyW += hvW; notes.push('fontes'); hv.forEach(x => { if (Math.abs(x.v - V) / V > 0.25) R.alert('a', `Fonte de ${nf(x.v, 1)} V num sistema de ${nf(V, 1)} V: confira se está certo.`); }); }
    const gen = it.gen.map(g => ({ kva: N(g.kva, 0), pf: N(g.pf, 0.8) }));
    const genW = sum(gen, g => g.kva * 1000 * g.pf);
    if (genW) { R.row('Potência ativa dos geradores', genW, 'W', 'calc', 0, `P = kVA × FP × 1000 = ${nf(genW, 0)} W`); if (!hvW) { supplyW += genW * 0.9; notes.push('gerador (−10% de perdas na retificação)'); } }
    const rectA = sum(it.rect, r => N(r.qty, 1) * N(r.a, 0));
    if (rectA) { R.row('Corrente das pontes retificadoras', rectA, 'A', 'calc', 0, `Iret = Σ(qtd × A) = ${nf(rectA, 0)} A`); if (rectA < I * 1.5) R.alert('p', `As pontes somam ${nf(rectA, 0)} A e o consumo médio é ${nf(I, 0)} A. Use pelo menos 1,5× a corrente (${nf(I * 1.5, 0)} A) e dissipador.`); }
    if (genW && genW * 0.9 < pin) R.alert('p', `O gerador entrega ~${nf(genW * 0.9, 0)} W úteis e o consumo médio estimado é ${nf(pin, 0)} W: ele vai cair de rotação/tensão.`);
    // baterias
    let bankWh = 0, bankImax = 0;
    it.bat.forEach(b => {
      const t = BAT_TECH[b.tech] || BAT_TECH.agm, q = N(b.qty, 1), s = Math.max(1, Math.round(N(b.s, 1))), p = Math.max(1, Math.floor(q / s));
      const vb = N(b.v, 12) * s, ah = N(b.ah, 0) * p, wh = vb * ah * t.dod / 100; bankWh += wh; bankImax += ah * t.cmax * 3;
      R.row(`Banco de baterias (${s}S × ${p}P)`, vb, 'V', 'calc', 1, `Vbanco = ${s} × ${nf(N(b.v, 12), 1)} V; Ah = ${p} × ${nf(N(b.ah, 0), 0)} = ${nf(ah, 0)} Ah`);
      R.row('Energia útil do banco', wh, 'Wh', 'calc', 0, `E = V × Ah × DoD = ${nf(vb, 1)} × ${nf(ah, 0)} × ${t.dod}% = ${nf(wh, 0)} Wh`);
      if (s * p !== q) R.alert('a', `${q} baterias não fecham ${s} em série × ${p} em paralelo: sobra ${q - s * p}. Baterias soltas desequilibram o banco.`);

        return { who: 'ai', t: [`Para ${nf(I, 0)} A: bitola mínima ${a} mm² de cobre (referência de ${J_CABLE} A/mm² em uso contínuo — CALCULADO).`, `Com ${nf(len, 1)} m (ida) a queda fica ~${nf(dv, 2)} V (${nf(dv / V * 100, 1)}% em 12,6 V)${dv / V > 0.03 ? ': acima de 3%, suba uma bitola ou use cabos em paralelo' : ''}.`, `Fusível: ${nextUp(FUSES, I * 1.25)} A perto da bateria. Cabo CCA precisa de ~1,6× a seção do cobre.`].join('\n'), go: [go('Calculadora de cabo + fusível', { v: 'tool', id: 'cable' })] };
      }
      return { who: 'ai', t: 'Me diga a corrente e o comprimento, ex.: "bitola para 300 A com 4 m".', go: [go('Calculadora de cabo + fusível', { v: 'tool', id: 'cable' })] };
    }
    // ultracapacitores
    if (has('ultracap', 'ultra cap', 'supercap', 'capacitor')) {
      const vc = this.num(t, /(\d+(?:[.,]\d+)?)\s*v\b/) || 3, target = this.num(t, /para\s*(\d+(?:[.,]\d+)?)/) || 14.4;
      const n = Math.ceil(target * 1.05 / vc);
      return { who: 'ai', t: [`Para trabalhar em ${nf(target, 1)} V com células de ${nf(vc, 2)} V: ${n} em série (${nf(n * vc, 1)} V de máximo, com ~5% de folga — CALCULADO).`, 'Cada célula precisa de placa de balanceamento. Com 3000 F: capacitância do conjunto = 3000 ÷ ' + n + ' = ' + nf(3000 / n, 0) + ' F.', 'Carregue com pré-carga (resistor) para não dar faísca nem queimar fusível.'].join('\n'), go: [go('Banco de ultracapacitores', { v: 'tool', id: 'ucap' }), go('Pré-carga', { v: 'tool', id: 'prech' })] };
    }
    // delay
    if (has('delay', 'atraso', 'distancia')) {
      const ns = [...t.matchAll(/(\d+(?:[.,]\d+)?)\s*cm/g)].map(m => parseFloat(m[1].replace(',', '.')));
      if (ns.length >= 2) { const c = 345.7, mx = Math.max(...ns); return { who: 'ai', t: ['Delay calculado (25 °C, c = 345,7 m/s):', ...ns.map(d => `• ${nf(d, 0)} cm → ${nfx((mx - d) / 100 / c * 1000, 2)} ms`), 'O falante mais longe fica em 0 ms.'].join('\n'), go: [go('Delay por distância', { v: 'tool', id: '_delay' })] }; }
      return { who: 'ai', t: 'Meça com a trena cada falante até a cabeça do motorista e me diga, ex.: "delay: 120 cm, 95 cm e 80 cm".', go: [go('Delay por distância', { v: 'tool', id: '_delay' })] };
    }
    // fórmulas rápidas
    if (has('kva', 'gerador')) return { who: 'ai', t: 'kW = kVA × fator de potência (0,8 típico). Corrente monofásica: I = kVA × 1000 ÷ V. Para som, dimensione o gerador para o consumo médio + 25% e a ponte retificadora para 1,5× a corrente.', go: [go('Gerador: kVA, kW e corrente', { v: 'tool', id: 'gen' }), go('Ponte retificadora', { v: 'tool', id: 'rect' })] };
    if (has('bateria', 'autonomia', 'ah')) return { who: 'ai', t: 'Série soma tensão; paralelo soma Ah. Energia útil = V × Ah × profundidade de descarga (50% chumbo-ácido, 90% LiFePO4). Autonomia = energia útil ÷ consumo médio (e ainda menor em descarga forte, efeito Peukert).', go: [go('Banco de baterias', { v: 'tool', id: 'bat' })] };
    if (has('impedancia', 'ohm', 'ligacao', 'serie', 'paralelo')) return { who: 'ai', t: 'Falantes iguais em série: Z = n × Z. Em paralelo: Z = Z ÷ n. Nunca fique abaixo da impedância mínima do amplificador. A potência que o módulo entrega muda com a impedância — veja a calculadora.', go: [go('Amplificador + falantes', { v: 'tool', id: 'amp' })] };
    if (has('limitador', 'limiter', 'proteger', 'driver', 'tweeter')) return { who: 'ai', t: 'Limitador: tensão máxima = √(P × R). Ex.: driver de 100 W RMS em 8 Ω → √(100×8) = 28,3 V. Ajuste o limitador da saída para não passar disso, e use passa-alta adequado.', go: [go('Calculadora de limitador', { v: 'tool', id: 'limit' })] };
    if (has('pre-carga', 'precarga', 'faisca')) return { who: 'ai', t: 'Pré-carga: um resistor entre o banco e os capacitores limita a corrente de ligação. Corrente inicial = V ÷ R; carga em ~5 × R × C segundos. Depois feche o contator/chave de bypass.', go: [go('Pré-carga de capacitores', { v: 'tool', id: 'prech' })] };
    if (has('oi', 'ola', 'bom dia', 'boa tarde', 'boa noite')) return { who: 'ai', t: 'Olá! Me diga o que você quer analisar: projeto, regulagem, tensão, medição, bitola, ultracaps ou delay.' };
    return { who: 'ai', t: 'Não entendi bem. Posso: analisar seu projeto de som, revisar a regulagem do processador, ler a tensão, interpretar medições, calcular bitola e fusível, ultracapacitores, delay, gerador e baterias. Tente, por exemplo: "bitola para 250 A com 5 m".', go: [go('Meu Projeto de Som', { v: 'proj' }), go('Medição com microfone', { v: 'tool', id: '_meas' })] };
  },
};

})();
</script>
